# The checks of handover section 4 on every push (any branch) and pull request: the lesson rules and the word verifier
# (make lint), the tests of the build guards and the word pipeline (make test), and the card check at the end of the
# app build (make app): no word without a card, no card lost, no card with poorer English than before.
name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit (the tag is only a comment): a moved or hijacked tag cannot change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-build-lock.txt

      - name: Python packages
        run: pip install --require-hashes -r requirements-lock.txt -r requirements-build-lock.txt

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/raw
          key: raw-${{ hashFiles('data/fetch.sh') }}

      - name: Databases (public and non-commercial)
        run: |
          make db
          make db-nc

      - name: Lessons and words
        run: make lint

      - name: Build guards and word pipeline
        run: make test

      - name: App and card check
        run: |
          make app
          make check
