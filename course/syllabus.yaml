  - {n: 2, en: "Where are you from?", vi: "Anh là người nước nào?", grammar: "người + nationality (modifier after the noun); ở đâu; nào; không + verb; cũng; à (checking: Anh là người Pháp à?)", bridge: B0 what Hán-Việt is, lines: 7, new_words: {native: 11, hv: 5, other: 2}}
