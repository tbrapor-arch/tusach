# The course plan. No lesson may be drafted before the owner approves the syllabus AND the first word list
# (fixed decision, 17 Nov 2026): tools/lint.py refuses any file in course/lessons/ while either is not approved.
# Proposal: course/proposal/syllabus-proposal.md (second version, 18 Nov 2026); word list:
# course/proposal/wordlist-2.tsv (lessons 1-13). Both APPROVED by the owner on 19 Nov 2026 (below).
# Pronunciation: Northern (Hà Nội). Lesson language: English.
# lessons: the plan lint checks a written lesson against (lines; new_words native / hv, where native counts every
# word that is not Hán-Việt, older and Western loans included). L1-13 new_words are word list 2's real counts.
approved:
  syllabus: {by: owner, date: 2026-11-19}
  word_list: {by: owner, date: 2026-11-19, file: [course/proposal/wordlist-2.tsv, course/proposal/wordlist-3.tsv]}
# the draft the owner is asked to approve: tools/plan.py checks it against this plan (make lint)
draft: {word_list: course/proposal/wordlist-3.tsv, proposal: course/proposal/syllabus-proposal.md}
cast: [Sacha, Lan, Minh, Thảo, Hùng, Tuấn, Mai, Bin, Na]
# the Northern particle strand: each particle, the lesson that brings it in (its grammar names it), its use
particles:
  - {w: ạ, n: 1, use: "polite, to someone older: Chào chị ạ."}
  - {w: à, n: 2, use: "checking what one has just heard, or surprise: Anh là người Pháp à?"}
  - {w: ơi, n: 3, use: "calling someone: Em ơi!"}
  - {w: nhé, n: 3, use: "friendly \"OK?\" on a suggestion or promise: Hai cà phê sữa đá nhé!"}
  - {w: phải không, n: 3, use: "\"…, right?\": Anh là người Pháp, phải không?"}
  - {w: đấy, n: 6, use: "a friendly question: Anh đi đâu đấy?"}
  - {w: đi, n: 8, use: "urging or suggesting, after the verb: Đi thẳng đi!"}
  - {w: nào, n: 8, use: "urging, \"let's\": Đi nào!"}
  - {w: nhỉ, n: 9, use: "seeking agreement: Nóng nhỉ!"}
  - {w: thế, n: 9, use: "\"so\" (Nóng thế!), and in questions \"then\" (Sao thế? at L12); the South says vậy"}
  - {w: đâu, n: 12, use: "emphatic \"not at all\": Không sao đâu! (first met at L2 in ở đâu \"where\")"}
  - {w: thôi, n: 15, use: "\"only, that's all\": Hai mươi nghìn thôi."}
  - {w: hả, n: 16, use: "a blunt, familiar question, to equals or younger people: Con no rồi hả?"}
  - {w: nhá, n: 16, use: "the familiar Northern nhé, to children and close friends: Ăn đi nhá!"}
  - {w: với, n: 17, use: "softening a request for help, at the end: Giúp em với!"}
  - {w: chứ, n: 18, use: "\"of course\", \"surely\": Được chứ!"}
  - {w: dạ, n: 19, use: "the deferential \"yes\" and answer to a call, to elders: Dạ, cháu đây ạ."}
  - {w: mà, n: 27, use: "insisting, \"I told you\": Em biết mà!"}
  - {w: cơ, n: 44, use: "insisting on the right one: Em muốn cái kia cơ!"}
  - {w: nha, n: 67, use: the Southern nhé}
  - {w: vậy, n: 67, use: "as a final particle, the Southern counterpart of thế (Sao vậy?); in vì vậy, như vậy it is general"}
