id: 7
title: {vi: Chào anh, en: Review 1}
review: true
setting: >-
  Monday, half past six in the evening. On his way home from work Sacha stops at the pavement tea stall of lesson 4.
  A man of about forty sits down beside him: anh Minh, home early for once. Nothing new in this dialogue: every word
  comes from lessons 1–6. The notes gather what you have met so far.
dialogue:
- {n: 1, speaker: Minh, vi: "Chào em! Em là Sacha, phải~right không?", en: "Hi! You're Sacha, aren't you?", lit: "greet younger-sibling! younger-sibling be Sacha, right not?"}
- {n: 2, speaker: Sacha, vi: "Vâng ạ. Anh là anh Minh à?", en: "Yes. Are you Minh?", lit: "yes (polite). elder-brother be elder-brother Minh (checking)?"}
- {n: 3, speaker: Minh, vi: "Anh là Minh, chồng chị Lan. Em đi đâu về đấy?", en: "I'm Minh, Lan's husband. Where are you coming back from?", lit: "elder-brother be Minh, husband elder-sister Lan. younger-sibling go where return (friendly)?"}
- {n: 4, speaker: Sacha, vi: "Em đi làm về ạ. Em làm ở một công_ty Pháp.", en: "From work. I work for a French company.", lit: "younger-sibling go work return (polite). younger-sibling work at one company France."}
- {n: 5, speaker: Minh, vi: "Mấy giờ em đi làm?", en: "What time do you go to work?", lit: "how-many hour younger-sibling go work?"}
- {n: 6, speaker: Sacha, vi: "Bảy giờ rưỡi sáng ạ.", en: "At half past seven in the morning.", lit: "seven hour half morning (polite)."}
- {n: 7, speaker: Minh, vi: "Chị ơi! Cho em hai cốc trà đá~ice.", en: "Excuse me! Two iced teas, please.", lit: "elder-sister hey! give younger-sibling two glass tea ice."}
- {n: 8, speaker: Stall owner, vi: "Hai cốc, mười nghìn.", en: "Two glasses: ten thousand.", lit: "two glass, ten thousand."}
- {n: 9, speaker: Sacha, vi: "Rẻ quá! Cảm_ơn anh ạ.", en: "That's so cheap! Thank you.", lit: "cheap so! thank elder-brother (polite)."}
notes:
- {ref: 1, topic: particles, text: "Em là Sacha, phải không? and Anh là anh Minh à? both check a guess: phải không asks \"…, right?\"; à checks what one has just understood."}
- {ref: 3, topic: particles, text: "Em đi đâu về đấy? \"where are you coming back from?\" is a friendly greeting, like Đi đâu đấy? in lesson 6; a vague answer is enough: Em đi làm về."}
- {ref: 0, topic: pronouns, text: "Pronouns so far. tôi: neutral \"I\" with strangers. anh, chị: a man, a woman a little older (\"you\"), or \"I\" said by them. em: someone younger, or \"I\" to someone older. bác / cháu: Sacha and Lan's mother. ông, bà: grandfather, grandmother. He or she: anh ấy, chị ấy. Sacha is em to Lan and Minh, anh to Thảo, cháu to bác."}
- {ref: 0, topic: grammar, text: "Word order so far. The describing word follows: người Pháp, công ty Pháp, cà phê sữa đá, quán này. Time words usually come first or right after the subject. cũng, không, đang, sẽ go before the verb. là joins two nouns; \"is not\" before a noun is không phải là. Ages and prices need no verb."}
- {ref: 0, topic: grammar, text: "Questions so far: gì \"what\", ai \"who\", đâu / ở đâu \"where\", nào \"which\", mấy \"how many (small)\", bao nhiêu \"how much\", each where the answer goes; có … không? for yes or no; …, phải không? \"…, right?\"."}
- {ref: 0, topic: particles, text: "Final particles so far: ạ (polite), à (checking, surprise), ơi (calling: Chị ơi!), nhé (a friendly \"OK?\"), đấy (friendly questions)."}
- {ref: 0, topic: numbers, text: "Numbers and the clock: mười lăm 15, hai mươi mốt 21, hai mươi tư 24, ba mươi lăm 35, trăm 100, nghìn 1,000. bảy giờ rưỡi sáng 7:30 a.m., sáu giờ chiều 6 p.m., chín giờ tối 9 p.m."}
- {ref: 0, topic: usage, text: "Northern words met so far, where the South uses another: cốc ({ly}), nhé ({nha}), đắt ({mắc}), nghìn ({ngàn}), bố ({ba}), đấy ({đó}), vâng ({dạ}). This course keeps to Hà Nội."}
- {ref: 0, topic: pronunciation, text: "Six tones: ngang (level: anh, em), huyền (low falling: là, người), sắc (rising: có, tám), hỏi (low: bảy), ngã (broken: sữa, rưỡi), nặng (low, short: chị, mẹ). A syllable ending in -p, -t, -c, -ch takes only sắc or nặng: rất, gặp, học. After o, ô, u the finals -ng and -c close the lips: không, công ty, học, cốc."}
new_words: []
exercises:
  translate:
  - {vi: "Chị Lan bao_nhiêu tuổi?", en: "How old is Lan?"}
  - {vi: "Bin và Na không uống cà_phê.", en: "Bin and Na don't drink coffee."}
  - {vi: "Bây_giờ là mười giờ rưỡi sáng.", en: "It's half past ten in the morning."}
  - {vi: "Bảy giờ tối anh Minh về nhà.", en: "Minh comes home at seven in the evening."}
  - {vi: "Xin_lỗi, quán này có cà_phê sữa không?", en: "Excuse me, does this café have white coffee?"}
  - {vi: "Mẹ chị Lan cũng là người Hà_Nội à?", en: "So Lan's mother is from Hà Nội too?"}
  fill:
  - {vi: "Chị ấy là ___? – Chị Thảo, em chị Lan.", answer: ai, en: "Who is she? – Thảo, Lan's younger sister."}
  - {vi: "Em ___ đi làm à?", answer: cũng, en: "Are you going to work too? (to someone younger)"}
  - {vi: "Một cốc cà_phê ___ mươi lăm nghìn.", answer: "ba~three", en: "A coffee is thirty-five thousand."}
