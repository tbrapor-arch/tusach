id: 14
title: {vi: Sinh nhật bác, en: Review 2}
review: true
setting: >-
  Sunday evening, the birthday dinner of chị Lan's mother, at home: Lan, Minh, the children, Thảo and Sacha. Sacha
  gives her the red top he bought with Thảo the day before. Nothing new in this dialogue: every word comes from
  lessons 1–13. The notes gather what lessons 8–13 brought.
dialogue:
- {n: 1, speaker: Sacha, vi: "Cháu chào bác ạ. Cháu tặng bác cái áo này ạ.", en: "Good evening. This top is a present for you.", lit: "grandchild greet uncle-aunt (polite). grandchild give-as-present uncle-aunt (thing) top this (polite)."}
- {n: 2, speaker: Bác, vi: "Cảm_ơn cháu! Áo đẹp thế! Cháu mua ở đâu đấy?", en: "Thank you! What a lovely top! Where did you buy it?", lit: "thank grandchild! top beautiful so! grandchild buy at where (friendly)?"}
- {n: 3, speaker: Sacha, vi: "Cháu mua ở chợ, với Thảo ạ. Bác mặc thử đi ạ!", en: "At the market, with Thảo. Do try it on!", lit: "grandchild buy at market, with Thảo (polite). uncle-aunt wear try (urging) (polite)!"}
- {n: 4, speaker: Bác, vi: "Vừa lắm! Đẹp nhỉ! Sao~why cháu biết bác thích màu đỏ?", en: "It fits perfectly! Lovely, isn't it? How did you know I like red?", lit: "fit very! beautiful (isn't-it)! how grandchild know uncle-aunt like colour red?"}
- {n: 5, speaker: Sacha, vi: "Vì Thảo nói với cháu ạ.", en: "Because Thảo told me.", lit: "because Thảo say with grandchild (polite)."}
- {n: 6, speaker: Minh, vi: "Em khỏe chưa? Ăn thêm thịt gà đi!", en: "Are you better yet? Have some more chicken!", lit: "younger-sibling well not-yet? eat more meat chicken (urging)!"}
- {n: 7, speaker: Sacha, vi: "Em khỏe rồi ạ, không sao~why đâu. Em uống thuốc và nghỉ một ngày.", en: "I'm well now, it was nothing. I took some medicine and rested for a day.", lit: "younger-sibling well already (polite), not how (not-at-all). younger-sibling drink medicine and rest one day."}
- {n: 8, speaker: Lan, vi: "Thứ_bảy tuần sau em có rảnh không? Đi ăn phở với anh chị nhé!", en: "Are you free next Saturday? Come and have phở with Minh and me!", lit: "Saturday week after younger-sibling (yes) free not? go eat phở with elder-brother elder-sister, OK!"}
- {n: 9, speaker: Sacha, vi: "Vâng ạ! Em thích phở lắm. Mấy giờ ạ?", en: "Yes! I like phở a lot. What time?", lit: "yes (polite)! younger-sibling like phở very. how-many hour (polite)?"}
- {n: 10, speaker: Lan, vi: "Bảy giờ rưỡi sáng, ở quán phở gần nhà.", en: "Half past seven in the morning, at the phở place near the house.", lit: "seven hour half morning, at shop phở near house."}
notes:
- {ref: 1, topic: pronouns, text: "Cháu tặng bác cái áo này ạ: cháu to bác; ạ keeps it polite (to an elder, {biếu} is the respectful \"give\"). Bác says bác for \"I\" (line 4)."}
- {ref: 0, topic: pronouns, text: "Pronouns so far. tôi: neutral. bạn / tôi: the same age (Sacha, Mai). anh / em: Sacha is em to Minh, anh to Thảo. chị / em: Sacha with Lan. bác / cháu: Sacha with Lan's mother. In line 8, anh chị is \"Minh and I\"."}
- {ref: 0, topic: grammar, text: "Orders (lesson 8): verb + đi urges (Ăn thêm thịt gà đi!); đừng + verb \"don't\"; nào urges, the speaker included (Đi nào!). A person term in front softens: Bác mặc thử đi ạ!"}
- {ref: 0, topic: grammar, text: "Adjectives (lesson 9) need no là: Áo đẹp. Degree: rất đẹp, đẹp lắm, đẹp quá!, hơi nhỏ; thế \"so\" (Áo đẹp thế!); nhỉ asks the listener to agree."}
- {ref: 0, topic: grammar, text: "Lesson 10: đã … chưa? \"… yet?\"; Chưa \"not yet\"; rồi after the verb: Em khỏe rồi."}
- {ref: 0, topic: grammar, text: "Days and plans (lesson 11): thứ bảy, chủ nhật; tuần sau \"next week\" (new here: tuần + sau); bao giờ \"when\"; định + verb; hay \"or\" in a question. Times as in lesson 6: bảy giờ rưỡi sáng."}
- {ref: 0, topic: grammar, text: "Health and reasons (lesson 12): bị + something bad (bị cảm); nên \"should\", phải \"must\"; sao / tại sao \"why?\" – vì \"because\"; Không sao đâu \"it's nothing\"."}
- {ref: 0, topic: grammar, text: "Shopping (lessons 10, 13): cái for most things (cái này \"this one\"), quả for round things, bát and cốc as counters. Colours follow the noun (áo đỏ). vừa \"to fit\"; lấy \"take\"."}
- {ref: 0, topic: bridge, text: "Hán-Việt tones. First, a syllable in -p, -t, -c, -ch has only sắc or nặng: Cantonese 1 or 3 usually sắc, 6 nặng. Otherwise, usually: Mandarin tone 1 gives ngang, tone 2 huyền (ngang after m, n, l, r, y, w or none), tone 3 hỏi (ngã after them), tone 4 sắc or nặng (Cantonese 3 or 6)."}
new_words: []
exercises:
  translate:
  - {vi: "Hôm_qua trời mưa, nhưng hôm_nay trời đẹp nhỉ!", en: "It rained yesterday, but it's lovely today, isn't it!"}
  - {vi: "Em đã ăn cơm chưa? – Em ăn rồi ạ.", en: "Have you eaten yet? – Yes, I have. (asked by an older person, answered by a younger one)"}
  - {vi: "Đi thẳng phố này, rồi rẽ phải~right ở chợ.", en: "Go straight along this street, then turn right at the market."}
  - {vi: "Tại_sao chị Lan không mua cái áo trắng?", en: "Why didn't Lan buy the white top?"}
  - {vi: "Thứ_bảy anh Minh định đi chợ với Bin.", en: "On Saturday Minh is planning to go to the market with Bin."}
  - {vi: "Bao_giờ chị Lan về nhà?", en: "When will Lan come home?"}
  fill:
  - {vi: "Em ăn ___ đi!", answer: thêm, en: "Have some more! (to someone younger)"}
  - {vi: "Bạn thích màu trắng ___ màu đen?", answer: "hay~or", en: "Do you like white or black? (to someone of your age)"}
  - {vi: "Cháu bị cảm, cháu ___ nghỉ ở nhà.", answer: nên, en: "You've caught a cold: you should rest at home. (bác to cháu)"}
  - {vi: "Hôm_nay trời ___ lạnh.", answer: hơi, en: "It's a bit cold today."}
