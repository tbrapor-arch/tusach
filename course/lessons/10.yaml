exercises:
  translate:
  - {vi: "Hôm_qua chị Lan ăn phở gà.", en: "Yesterday Lan had chicken phở."}
  - {vi: "Em ăn cơm chưa?", en: "Have you eaten yet? (to someone younger)"}
  - {vi: "Na ăn hai quả trứng.", en: "Na eats two eggs."}
  - {vi: "Cho tôi thêm một cốc trà đá~ice.", en: "Another glass of iced tea, please."}
  - {vi: "Món này ngon, nhưng hơi đắt.", en: "This dish is tasty, but a bit expensive."}
  fill:
  - {vi: "Em đã uống cà_phê ___?", answer: chưa, en: "Have you had a coffee yet? (to someone younger)"}
  - {vi: "Cho em hai ___ phở gà.", answer: bát, en: "Two bowls of chicken phở, please."}
  - {vi: "Na ___ rồi, Na không ăn thêm.", answer: "no", en: "Na is full: she won't eat any more."}
