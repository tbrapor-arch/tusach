- {w: cơm, en: "(cooked) rice; a meal"}
- {w: bát, en: "bowl (Northern)"}
- {w: món, en: "dish (of food); item"}
- {w: ngon, en: "tasty, delicious"}
- {w: thịt, en: meat}
- {w: bò, en: "cow, ox; beef"}
- {w: gà, en: chicken}
- {w: đã, en: "(past) did, already; had"}
- {w: chưa, en: "not yet; (question) … yet?"}
- {w: "no", en: "full (after eating)"}
- {w: đói, en: hungry}
- {w: gọi, en: "to call; to order (food)"}
- {w: thêm, en: "more, extra; to add"}
