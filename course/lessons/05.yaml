id: 5
title: {vi: Ảnh gia đình, en: A family photo}
review: false
setting: >-
  Evening, in the living room. Chị Lan shows Sacha a framed photo on the family altar shelf. Her mother, who lives
  with them, is in the kitchen.
dialogue:
- {n: 1, speaker: Lan, vi: "Đây là ảnh gia_đình chị.", en: "This is a photo of my family.", lit: "here be photo family elder-sister."}
- {n: 2, speaker: Sacha, vi: "Anh ấy là ai ạ?", en: "Who is he?", lit: "elder-brother that be who (polite)?"}
- {n: 3, speaker: Lan, vi: "Anh Minh, chồng chị. Đây là con chị, Bin và Na.", en: "That's Minh, my husband. And these are my children, Bin and Na.", lit: "elder-brother Minh, husband elder-sister. here be child elder-sister, Bin and Na."}
- {n: 4, speaker: Sacha, vi: "Hai cháu mấy tuổi ạ?", en: "How old are the children?", lit: "two grandchild how-many age (polite)?"}
- {n: 5, speaker: Lan, vi: "Bin tám tuổi, Na năm~five tuổi.", en: "Bin is eight and Na is five.", lit: "Bin eight age, Na five age."}
- {n: 6, speaker: Sacha, vi: "Bác này là bố chị à?", en: "And this man, is he your father?", lit: "uncle this be father elder-sister (checking)?"}
- {n: 7, speaker: Lan, vi: "Không phải~right, bố anh Minh. Mẹ chị đây!", en: "No, that's Minh's father. And here's my mother!", lit: "not right, father elder-brother Minh. mother elder-sister here!"}
- {n: 8, speaker: Sacha, vi: "Cháu chào bác ạ!", en: "Good evening! (to Lan's mother)", lit: "grandchild greet uncle-aunt (polite)!"}
notes:
- {ref: 1, topic: grammar, text: "Đây là … \"this is …\", for what you show or point at; đây is \"here, this (one)\". ảnh gia đình chị \"photo + family + me\": each word describes the one before, and the owner comes last."}
- {ref: 2, topic: pronouns, text: "Person term + ấy (\"that\") is \"he\" or \"she\": anh ấy for a man of about one's own age or a little older, chị ấy for such a woman, em ấy for someone younger. ai \"who\" stays where the answer goes: Anh ấy là ai? – Anh Minh."}
- {ref: 3, topic: grammar, text: "chồng chị \"my husband\", con chị \"my children\": with family and close ties, của \"of\" is left out. With things it is usual: Cốc này của ai? \"whose glass is this?\", cốc của em \"your glass\"."}
- {ref: 3, topic: usage, text: "con is a son or daughter, one or several: con chị \"my child(ren)\". chồng \"husband\" and vợ \"wife\": Lan is vợ anh Minh."}
- {ref: 4, topic: pronouns, text: "cháu is a grandchild, nephew or niece, and the word for any child of a friend's generation. Talking to Lan about her children, Sacha calls them cháu: hai cháu \"the two children\"."}
- {ref: 4, topic: grammar, text: "mấy \"how many\" expects a small number, so it is the way to ask a child's age: Cháu mấy tuổi? For an adult one asks with bao nhiêu: Anh bao nhiêu tuổi? The age needs no verb: Bin tám tuổi \"Bin (is) eight\"."}
- {ref: 6, topic: pronouns, text: "bác is for anyone of one's parents' generation, older than one's parents: Sacha will call Lan's mother bác and himself cháu. Bác này \"this man (of that generation)\". bố \"dad\" (the South says ba) and mẹ \"mum\" together are bố mẹ \"parents\"."}
- {ref: 7, topic: grammar, text: "Mẹ chị đây! \"here's my mother!\": đây after the noun announces that someone or something is here."}
- {ref: 8, topic: pronouns, text: "Cháu chào bác ạ: \"I\" + chào + \"you\" + ạ, the full polite greeting to an elder. A child greets a grandparent Cháu chào ông ạ or Cháu chào bà ạ; ông and bà are grandfather and grandmother, and later \"you\" to old people (lesson 19)."}
- {ref: 1, topic: bridge, text: "gia đình is 家庭 (Mandarin jiātíng), the same word; ông is 翁 (wēng), bà is 婆 (pó)."}
- {ref: 0, topic: pronunciation, text: "ảnh ends in Hà Nội -nh after a, roughly [ajŋ] (Lesson 0). mẹ and vợ are nặng, low and cut short; tuổi and của are hỏi, low falling. chồng and ông close the lips at the end (the lip rule)."}
new_words:
- {w: gia_đình, en: family}
- {w: ảnh, en: "photo, picture"}
- {w: bố, en: "father, dad (Northern)"}
- {w: mẹ, en: "mother, mum"}
- {w: ông, en: "grandfather; old man; Mr, sir; you (to an older man)"}
- {w: bà, en: "grandmother; old woman; Mrs, madam; you (to an older woman)"}
- {w: chồng, en: husband}
- {w: vợ, en: wife}
- {w: con, en: "child; (classifier for animals)"}
- {w: cháu, en: "grandchild; niece, nephew; I (to someone of one's parents' or grandparents' generation)"}
- {w: bác, en: "uncle, aunt (older than one's parent); you (to a person older than one's parents)"}
- {w: của, en: "of, belonging to"}
- {w: ai, en: "who; anyone, someone"}
- {w: ấy, en: "that (anh ấy he, cô ấy she)"}
- {w: mấy, en: "how many (small numbers); a few"}
- {w: tuổi, en: "age; years old"}
- {w: đây, en: "here; this (one)"}
- {w: Minh, en: "Minh (a man's name)", name: true}
- {w: Bin, en: "Bin (a boy's nickname)", name: true}
- {w: Na, en: "Na (a girl's nickname)", name: true}
exercises:
  translate:
  - {vi: "Cốc trà này của ai?", en: "Whose glass of tea is this?"}
  - {vi: "Ông và bà ở Hà_Nội.", en: "Grandpa and Grandma live in Hà Nội."}
  - {vi: "Vợ anh Minh là chị Lan.", en: "Minh's wife is Lan."}
  - {vi: "Chị ấy là người Pháp à?", en: "She's French, is she?"}
  - {vi: "Đây là tiền của em.", en: "This is your money. (to someone younger)"}
  - {vi: "Bố anh Minh bảy mươi tuổi.", en: "Minh's father is seventy."}
  fill:
  - {vi: "Em ___ tuổi?", answer: mấy, en: "How old are you? (to a child)"}
  - {vi: "Chị ___ là ai?", answer: ấy, en: "Who is she?"}
  - {vi: "Cháu chào ___ ạ!", answer: ông, en: "Hello! (a child to a grandfather)"}
