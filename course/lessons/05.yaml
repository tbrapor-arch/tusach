id: 5
title: {vi: Ảnh gia đình, en: A family photo}
review: false
setting: >-
  Evening, in the living room. Chị Lan shows Sacha a framed photo on the family altar shelf. Her mother, who lives
  with them, is in the kitchen.
dialogue:
- {n: 1, speaker: Lan, vi: "Đây là ảnh gia_đình chị.", en: "This is a photo of my family.", lit: "here be photo family elder-sister."}
- {n: 2, speaker: Sacha, vi: "Anh ấy là ai ạ?", en: "Who is he?", lit: "elder-brother that be who (polite)?"}
- {n: 3, speaker: Lan, vi: "Anh Minh, chồng chị. Đây là con chị, Bin và Na.", en: "That's Minh, my husband. And these are my children, Bin and Na.", lit: "elder-brother Minh, husband elder-sister. here be child elder-sister, Bin and Na."}
- {n: 4, speaker: Sacha, vi: "Hai cháu mấy tuổi ạ?", en: "How old are the children?", lit: "two grandchild how-many age (polite)?"}
- {n: 5, speaker: Lan, vi: "Bin tám tuổi, Na năm~five tuổi.", en: "Bin is eight and Na is five.", lit: "Bin eight age, Na five age."}
- {n: 6, speaker: Sacha, vi: "Bác này là bố chị à?", en: "And this man, is he your father?", lit: "uncle this be father elder-sister (checking)?"}
- {n: 7, speaker: Lan, vi: "Không phải~right, bố anh Minh. Mẹ chị đây!", en: "No, that's Minh's father. And here's my mother!", lit: "not right, father elder-brother Minh. mother elder-sister here!"}
- {n: 8, speaker: Sacha, vi: "Cháu chào bác ạ!", en: "Good evening! (to Lan's mother)", lit: "grandchild greet uncle-aunt (polite)!"}
notes:
- {ref: 1, topic: grammar, text: "Đây là … \"this is …\", for what you show; đây is \"here, this (one)\". ảnh gia đình chị \"my family photo\": photo + family + me, the owner last."}
- {ref: 2, topic: pronouns, text: "Anh ấy là ai? \"who is he?\": person term + ấy (\"that\") is \"he\" or \"she\": anh ấy for a man about one's age or a little older, chị ấy for such a woman. ai \"who\" stands where the answer goes."}
- {ref: 3, topic: grammar, text: "chồng chị \"my husband\", con chị \"my children\" (con: son or daughter, one or several; vợ \"wife\"): with family, của \"of\" is left out. With things của is common, but often dropped too: tiền của em or tiền em \"your money\"."}
- {ref: 4, topic: pronouns, text: "Hai cháu: cháu is a grandchild, nephew or niece, and the word for any child of a friend's generation: hai cháu \"the two children\"."}
- {ref: 4, topic: grammar, text: "mấy tuổi: mấy \"how many\" expects a small number, so it asks a child's age; for an adult one asks bao nhiêu tuổi. The age needs no verb: Bin tám tuổi \"Bin is eight\"."}
- {ref: 6, topic: pronouns, text: "Bác này \"this man (of my parents' generation)\": bác is for anyone of one's parents' generation, older than one's parents. Sacha calls Lan's mother bác and himself cháu. bố \"dad\", mẹ \"mum\"."}
- {ref: 7, topic: grammar, text: "Mẹ chị đây! \"here's my mother!\": đây after a noun says that someone has just come or is right here."}
- {ref: 8, topic: pronouns, text: "Cháu chào bác ạ: \"I\" + chào + \"you\" + ạ, the full polite greeting to an elder. ông and bà are grandfather and grandmother."}
- {ref: 1, topic: bridge, text: "gia đình is 家庭 (Mandarin jiātíng), the same word."}
new_words:
