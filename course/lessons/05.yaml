- {w: ảnh, en: "photo, picture"}
- {w: bố, en: "father, dad (Northern)"}
- {w: mẹ, en: "mother, mum"}
- {w: ông, en: "grandfather; old man; Mr, sir; you (to an older man)"}
- {w: bà, en: "grandmother; old woman; Mrs, madam; you (to an older woman)"}
- {w: chồng, en: husband}
- {w: vợ, en: wife}
- {w: con, en: "child; (classifier for animals)"}
- {w: cháu, en: "grandchild; niece, nephew; I (to someone of one's parents' or grandparents' generation)"}
- {w: bác, en: "uncle, aunt (older than one's parent); you (to a person older than one's parents)"}
- {w: của, en: "of, belonging to"}
- {w: ai, en: "who; anyone, someone"}
- {w: ấy, en: "that (anh ấy he, chị ấy she)"}
- {w: mấy, en: "how many (small numbers); a few"}
- {w: tuổi, en: "age; years old"}
- {w: đây, en: "here; this (one)"}
- {w: Minh, en: "Minh (a man's name)", name: true}
- {w: Bin, en: "Bin (a boy's nickname)", name: true}
- {w: Na, en: "Na (a girl's nickname)", name: true}
exercises:
