exercises:
  translate:
  - {vi: "Tôi muốn mua một cái áo trắng.", en: "I'd like to buy a white top."}
  - {vi: "Cái áo đen này hơi to.", en: "This black top is a bit big."}
  - {vi: "Bin thích màu đỏ.", en: "Bin likes red."}
  - {vi: "Hôm_qua anh Minh mua quà sinh_nhật ở cửa_hàng.", en: "Yesterday Minh bought a birthday present in a shop."}
  - {vi: "Chị Lan tặng Na một cái áo.", en: "Lan gave Na a top."}
  fill:
  - {vi: "Em mặc ___ cái áo này nhé?", answer: thử, en: "Shall I try this top on?"}
  - {vi: "Cái áo này ___ lắm!", answer: vừa, en: "This top fits perfectly!"}
  - {vi: "Tôi ___ cái này.", answer: lấy, en: "I'll take this one."}
