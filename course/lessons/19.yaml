exercises:
  translate:
  - {vi: "Bà Lan sống ở Hà_Nội.", en: "Mrs Lan lives in Hà Nội."}
  - {vi: "Chú ơi, chú có biết bơi không?", en: "Do you know how to swim? (a child to a man of his father's age)"}
  - {vi: "Quê ông Hùng xa lắm.", en: "Ông Hùng's home village is very far away."}
  - {vi: "Chị Lan pha cà_phê cho anh Minh.", en: "Lan makes coffee for Minh."}
  - {vi: "Cô ơi, cô dạy môn gì ạ?", en: "What subject do you teach? (to a woman teacher)"}
  fill:
  - {vi: "Cháu đi học chưa? – ___, cháu đi rồi ạ.", answer: dạ, en: "Have you been to school yet? – Yes, I have. (a child to an elder)"}
  - {vi: "Ông kể ___ cháu về Pháp nhé.", answer: cho, en: "I'll tell you about France. (an old man to a child)"}
  - {vi: "Thảo ___ chị Lan lắm.", answer: nhớ, en: "Thảo misses Lan a lot."}
