- {w: hỏng, en: "broken, out of order"}
- {w: sửa, tag: repair, en: "to repair, to fix"}
- {w: chắc, en: "probably, surely"}
- {w: tức, tag: upset, en: "annoyed, upset"}
exercises:
  translate:
  - {vi: "Hôm_qua anh Tuấn bị mất điện_thoại ở quán cà_phê.", en: "Yesterday Tuấn lost his phone at a café."}
  - {vi: "Chắc em quên khóa~lock cổng rồi.", en: "I must have forgotten to lock the gate."}
  - {vi: "Máy_tính của tôi bị hỏng, tôi phải~must đưa đi sửa~repair.", en: "My computer is broken; I have to take it to be repaired."}
  - {vi: "Bin được giáo_viên khen, nhưng Na thì bị giáo_viên hỏi nhiều.", en: "Bin was praised by the teacher, but Na got a lot of questions from the teacher."}
  - {vi: "Em tức~upset lắm, nhưng em không nói gì.", en: "I was really annoyed, but I said nothing."}
  fill:
  - {vi: "Cái ví~wallet của chị ___ trộm lấy mất rồi.", answer: "bị", en: "My wallet was taken by a thief."}
  - {vi: "Phòng này được chủ_nhà ___ rồi.", answer: "sửa~repair", en: "This room has been repaired by the landlord."}
  - {vi: "Khu này không ___ đâu, em đi về sớm nhé.", answer: "an_toàn", en: "This area isn't safe at all; go home early, OK?"}
doubt:
- {line: 1, text: "bị trộm lấy mất: natural, or is bị mất trộm / bị trộm the usual way to say a bike was stolen?"}
- {line: 7, text: "Would a ward policeman say Ở khu này hay bị mất xe lắm, or prefer khu này hay mất trộm xe?"}
- {line: 11, text: "còn ... được mà for 'I can even fix': natural, or should it be ... anh cũng sửa được?"}
