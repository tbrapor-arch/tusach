- {w: xe, en: "vehicle (bike, car, motorbike)"}
- {w: sân, en: "yard, courtyard"}
- {w: cổng, en: "gate"}
- {w: khóa, tag: lock, en: "to lock"}
- {w: công_an, en: "police, police officer"}
- {w: khu, en: "area, neighbourhood"}
- {w: điều_tra, en: "to investigate"}
- {w: an_toàn, en: "safe"}
- {w: tìm_thấy, en: "to find"}
- {w: thanh_niên, en: "young man, young people"}
