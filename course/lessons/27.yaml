exercises:
  translate:
  - {vi: "Ông Hùng vẫn đi xe_đạp.", en: "Ông Hùng still rides a bicycle."}
  - {vi: "Bin ăn thêm, Na không ăn nữa.", en: "Bin has some more; Na won't eat any more."}
  - {vi: "Mai quên vé ở văn_phòng.", en: "Mai left the tickets at the office."}
  - {vi: "Quê anh Minh là một làng nhỏ.", en: "Minh's home is a small village."}
  - {vi: "Hà_Nội là thành_phố đẹp nhất Việt_Nam!", en: "Hà Nội is the most beautiful city in Vietnam!"}
  fill:
  - {vi: "Cháu ___ nhỏ, cháu chưa đi học.", answer: còn, en: "I'm still little: I don't go to school yet. (a child to an elder)"}
  - {vi: "Em nói ___ đi, anh không nghe thấy.", answer: lại, en: "Say it again: I didn't hear. (to someone younger)"}
  - {vi: "Em biết ___!", answer: mà, en: "I know, I told you! (to someone older)"}
