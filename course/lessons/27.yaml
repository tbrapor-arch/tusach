id: 27
title: {vi: Chuyện của bà, en: "Bà's stories"}
review: false
setting: >-
  Sunday evening, after dinner. The children sit on the floor next to their grandmother, chị Lan's mother, who is 62.
  Sacha is drinking tea at the table. Na wants a story.
dialogue:
- {n: 1, speaker: Na, vi: "Bà ơi, bà kể chuyện cho cháu nghe đi!", en: "Grandma, tell me a story!", lit: "grandmother hey, grandmother tell story for grandchild listen (urging)!"}
- {n: 2, speaker: Bác, vi: "Bà lớn lên ở một làng nghèo gần Hà_Nội.", en: "I grew up in a poor village near Hà Nội.", lit: "grandmother grow up at one village poor near Hà Nội."}
- {n: 3, speaker: Bin, vi: "Khi đó có chiến_tranh ạ?", en: "Was there a war then?", lit: "when that have war (polite)?"}
- {n: 4, speaker: Bác, vi: "Có. Khi có chiến_tranh, bà còn nhỏ. Ngày đó khổ lắm.", en: "Yes. When the war was on, I was still little. Life was very hard in those days.", lit: "have. when have war, grandmother still small. day that hard very."}
- {n: 5, speaker: Na, vi: "Kể nữa đi bà!", en: "Tell us more, Grandma!", lit: "tell more (urging) grandmother!"}
- {n: 6, speaker: Bác, vi: "Rồi hòa_bình. Khi bà còn trẻ, bà lên thành_phố học. Ngày đó cả phố đi xe_đạp. Bây_giờ thì đông~crowded quá!", en: "Then came peace. When I was young, I came to the city to study. In those days the whole street went by bicycle. Now it's so crowded!", lit: "then peace. when grandmother still young, grandmother go-up city study. day that whole street go bicycle. now then crowded so!"}
- {n: 7, speaker: Bin, vi: "Bà kể chuyện này rồi mà!", en: "You've told us this one already!", lit: "grandmother tell story this already (insisting)!"}
- {n: 8, speaker: Bác, vi: "Thế à? Bà quên rồi. Bà già rồi mà!", en: "Have I? I'd forgotten. I'm old, you know!", lit: "so (surprised)? grandmother forget already. grandmother old already (insisting)!"}
- {n: 9, speaker: Sacha, vi: "Bác vẫn nhớ nhiều kỷ_niệm lắm ạ.", en: "You still remember so much.", lit: "uncle-aunt still remember many memory very (polite)."}
- {n: 10, speaker: Bác, vi: "Chuyện ngày đó bác không quên đâu, cháu ạ. Bây_giờ bác hạnh_phúc lắm.", en: "Those days I don't forget, you know. Now I'm very happy.", lit: "story day that uncle-aunt not forget (at-all), grandchild (polite). now uncle-aunt happy very."}
- {n: 11, speaker: Na, vi: "Bà ơi, kể lại chuyện xe_đạp đi!", en: "Grandma, tell the bicycle story again!", lit: "grandmother hey, tell again story bicycle (urging)!"}
notes:
- {ref: 1, topic: grammar, text: "Bà kể chuyện cho cháu nghe đi! \"tell me a story!\": kể chuyện \"to tell a story\" (chuyện \"a story; a matter\"); kể cho cháu nghe \"tell me (so I can hear)\", the usual way a child asks."}
- {ref: 2, topic: usage, text: "lớn lên \"to grow up\": lớn \"big; to grow\" + lên \"up\" (lesson 24). For size, Hà Nội speech says to (lesson 13); lớn is the general word, and the South's. làng \"village\"; nghèo \"poor\"; khổ \"hard, miserable\" (of a life, line 4)."}
- {ref: 4, topic: grammar, text: "bà còn nhỏ \"I was still little\": còn before a verb or an adjective is \"still\", a state not over yet; Khi bà còn trẻ \"when I was (still) young\" (line 6). trẻ \"young\". Ngày đó \"in those days\": ngày \"day\" + đó."}
- {ref: 5, topic: grammar, text: "Kể nữa đi! \"tell (us) more!\": nữa after the verb is \"more, further\". lại after the verb is \"again, over\": kể lại \"to tell again\" (line 11)."}
- {ref: 6, topic: grammar, text: "Bây giờ thì đông quá!: thì sets now against then (lesson 22). đông \"crowded\" is spelt like đông \"winter\" (lesson 9): another word. lên thành phố \"to go (up) to the city\", lên as in lesson 24; thành phố \"city\"; xe đạp \"bicycle\"; chiến tranh \"war\", hòa bình \"peace\"."}
- {ref: 7, topic: particles, text: "Bà kể chuyện này rồi mà! \"you have told this one already!\": mà at the end insists, \"I'm telling you, you know\". Bà già rồi mà! (line 8): the same mà, as an excuse. Between two clauses, mà is \"but\" (later)."}
- {ref: 9, topic: grammar, text: "Bác vẫn nhớ \"you still remember\": vẫn before the verb is \"still\", going on as before, often where one might expect a change. còn says \"still (not yet over)\"; vẫn \"still (in spite of it)\". kỷ niệm \"memories\"."}
- {ref: 10, topic: pronouns, text: "To the children she is bà, to Sacha bác (line 10): Chuyện ngày đó bác không quên đâu, cháu ạ, the old days put first as the topic: she forgets what she told, not what she lived. hạnh phúc \"happy\" (a happy life); a happy moment is vui. quên \"to forget\"."}
- {ref: 6, topic: bridge, text: "Spelling what Hà Nội says alike: gi with Mandarin j- and Cantonese g- (gia đình 家庭), else d (du lịch 遊歷); ch where Taigi has ts- (chiến 戰), tr where it has t- (trung 中), tranh an exception; for s or x, a Mandarin sh- points to s (sinh 生), a ch- more often to x. No Hán-Việt syllable starts with r."}
