- {w: họng, en: "throat"}
- {w: thở, en: "to breathe"}
- {w: khám, tag: examine, en: "to examine (a patient)"}
- {w: nhiệt_độ, en: "temperature"}
- {w: cao, en: "high, tall"}
- {w: cần, tag: need, en: "to need"}
- {w: bệnh_viện, en: "hospital"}
