exercises:
  translate:
  - {vi: "Nếu trời mưa thì chúng_ta ở nhà xem phim.", en: "If it rains, we'll stay home and watch a film."}
  - {vi: "Tôi cần~need mua thuốc ho~cough cho bố.", en: "I need to buy cough medicine for Dad."}
  - {vi: "Bà bị đau bụng, phải~must đi bệnh_viện.", en: "Grandma has a stomach ache; she has to go to hospital."}
  - {vi: "Anh khỏi bệnh chưa?", en: "Have you got over your illness yet?"}
  - {vi: "Trời lạnh quá, mũi em đỏ rồi. Bệnh này khó khỏi lắm.", en: "It's so cold, my nose has gone red. This illness is hard to shake off."}
  - {vi: "Bin ngã xe_đạp, bị đau tay và chân~leg.", en: "Bin fell off his bike and hurt his arm and leg."}
  fill:
  - {vi: "___ ngày_mai anh rảnh thì anh đến nhà em chơi nhé.", answer: "Nếu", en: "If you're free tomorrow, come round to my place."}
  - {vi: "Anh ___ bao_nhiêu tiền?", answer: "cần~need", en: "How much money do you need?"}
  - {vi: "Bác_sĩ ___ cho Na rất cẩn_thận.", answer: "khám~examine", en: "The doctor examined Na very carefully."}
doubt:
- {line: 1, text: "Anh thấy đau ở đâu? as a doctor's opening: natural, or Anh bị làm sao?"}
- {line: 5, text: "Anh thở sâu vào for 'take a deep breath': natural, or would a doctor say Anh hít sâu vào?"}
- {line: 10, text: "thì anh lại đến khám nhé: is quay lại khám the usual phrase?"}
- {line: 0, text: "Title changed from Lại đi bác sĩ to Lại đi khám bệnh: natural? Bridge: được and biết called older loans (of 得, 別?): please check."}
