id: 33
title: {vi: "Lại đi khám bệnh", en: "The doctor again"}
review: false
setting: "A week after Tết. The cold, damp Hà Nội spring has caught Sacha: a fever, a cough and a sore throat. Chị Lan sends him to the small clinic at the end of the lane."
dialogue:
- {n: 1, speaker: "Doctor", vi: "Chào anh. Anh thấy đau ở đâu?", en: "Hello. Where does it hurt?"}
- {n: 2, speaker: "Sacha", vi: "Chào bác_sĩ. Tôi bị sốt~fever và ho~cough nhiều, họng cũng đau.", en: "Hello, doctor. I've got a fever and a bad cough, and my throat hurts too."}
- {n: 3, speaker: "Doctor", vi: "Anh bị từ~from bao_giờ?", en: "Since when?"}
- {n: 4, speaker: "Sacha", vi: "Từ~from hôm_qua. Đêm hôm_qua tôi không ngủ được.", en: "Since yesterday. Last night I couldn't sleep."}
- {n: 5, speaker: "Doctor", vi: "Tôi khám~examine cho anh nhé. Anh thở sâu vào. … Nhiệt_độ của anh hơi cao.", en: "Let me examine you. Take a deep breath. … Your temperature is a bit high."}
- {n: 6, speaker: "Sacha", vi: "Tôi có cần~need đi bệnh_viện không?", en: "Do I need to go to hospital?"}
- {n: 7, speaker: "Doctor", vi: "Không cần~need. Nếu anh nghỉ và uống nhiều nước~water thì anh sẽ khỏi.", en: "No need. If you rest and drink plenty of water, you'll get better."}
- {n: 8, speaker: "Sacha", vi: "Tôi có phải~must tiêm không ạ?", en: "Do I have to have an injection?"}
- {n: 9, speaker: "Doctor", vi: "Không. Đây là đơn_thuốc. Mỗi ngày anh uống thuốc ba~three lần. Thuốc này không phải~right là kháng_sinh đâu.", en: "No. Here's the prescription. Take the medicine three times a day. This medicine isn't an antibiotic."}
- {n: 10, speaker: "Doctor", vi: "Nếu ba~three ngày nữa anh vẫn sốt~fever thì anh lại đến khám~examine nhé.", en: "If you still have a fever in three days, come back for another check-up."}
- {n: 11, speaker: "Sacha", vi: "Chị Lan ơi, bác_sĩ nói em cần~need nằm nghỉ ba~three ngày.", en: "Lan, the doctor says I need to stay in bed for three days."}
- {n: 12, speaker: "Lan", vi: "Thế thì em nằm đi. Nếu em đói thì chị nấu canh cho em.", en: "Then lie down. If you get hungry, I'll make you some soup."}
notes:
- {ref: 7, topic: "grammar", text: "nếu … thì: \"if … then\". The condition comes first with nếu, the result after thì: nếu anh nghỉ thì anh sẽ khỏi \"if you rest, you'll get better\". thì is the same word as in lesson 22 (khi … thì)."}
- {ref: 10, topic: "grammar", text: "The condition can carry a time: nếu ba ngày nữa anh vẫn sốt \"if in three days you still have a fever\". ba ngày nữa is \"three more days, in three days\"."}
- {ref: 6, topic: "grammar", text: "cần + verb: \"to need to\". The question is có cần … không? and the short answer không cần \"no need\". cần can also take a noun: em cần thuốc \"I need medicine\"."}
- {ref: 8, topic: "grammar", text: "cần and phải~must: cần is what is needed, phải what is required. có phải tiêm không? \"do I have to have a shot?\""}
- {ref: 2, topic: "usage", text: "Symptoms take bị: bị sốt \"to have a fever\", bị ho \"to have a cough\". A part of the body takes đau: đau họng \"sore throat\", {đau bụng} \"stomach ache\"."}
- {ref: 3, topic: "usage", text: "từ bao_giờ? \"since when?\"; the answer is từ + time: từ hôm_qua \"since yesterday\"."}
- {ref: 7, topic: "usage", text: "khỏi is \"to get over (an illness)\": anh sẽ khỏi \"you'll get better\"; khỏi bệnh \"to recover from an illness\"."}
- {ref: 9, topic: "usage", text: "Frequency: mỗi ngày … ba lần \"three times a day\". thuốc này không phải là … \"this medicine is not …\": không phải là is the negative of là."}
- {ref: 0, topic: "bridge", text: "讀 is read {độc} in Hán-Việt, but the everyday đọc \"to read\" is an older loan of the same character. được, and probably biết, are older loans too."}
