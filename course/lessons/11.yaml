  - {vi: "Bạn thích trà hay~or cà_phê?", en: "Do you like tea or coffee? (to someone of your age)"}
  - {vi: "Tháng chín ở Hà_Nội nóng lắm.", en: "September in Hà Nội is very hot."}
  - {vi: "Thứ_bảy anh Minh đi chơi với Bin và Na.", en: "On Saturday Minh goes out with Bin and Na."}
  - {vi: "Mai cũng làm ở công_ty này.", en: "Mai works for this company too."}
  fill:
  - {vi: "Cuối_tuần bạn ___ làm gì?", answer: định, en: "What are you planning to do at the weekend?"}
  - {vi: "Hôm_nay tôi ___ quá, tôi không rảnh.", answer: bận, en: "I'm so busy today: I'm not free."}
