id: 21
title: {vi: Quyển sách cho Na, en: Review 3}
review: true
setting: >-
  Sunday evening at home. Sacha gives Na the book about a cat he bought at the bookshop. Bin has a literature test
  tomorrow, and dinner is almost ready. Nothing new in this dialogue: every word comes from lessons 1–20. The notes
  gather what lessons 15–20 brought.
dialogue:
- {n: 1, speaker: Na, vi: "Chú ơi, quyển sách này hay~good quá! Chú mua cho cháu ạ?", en: "This book is lovely! Did you buy it for me?", lit: "uncle hey, (volume) book this good so! uncle buy for grandchild (polite)?"}
- {n: 2, speaker: Sacha, vi: "Chú mua cho cháu đấy. Cháu thích mèo, phải~right không?", en: "I bought it for you. You like cats, don't you?", lit: "uncle buy for grandchild (you-see). grandchild like cat, right not?"}
- {n: 3, speaker: Na, vi: "Dạ, cháu thích mèo nhất! Cảm_ơn chú ạ.", en: "Yes, I like cats best! Thank you.", lit: "yes (polite), grandchild like cat most! thank uncle (polite)."}
- {n: 4, speaker: Bin, vi: "Chú ơi, giúp cháu với! Ngày_mai cháu có kiểm_tra môn văn.", en: "Please help me! I've got a literature test tomorrow.", lit: "uncle hey, help grandchild (please)! tomorrow grandchild have test subject literature."}
- {n: 5, speaker: Sacha, vi: "Được chứ! Nhưng Bin đọc tiếng_Việt giỏi hơn chú đấy.", en: "Of course! But you read Vietnamese better than I do.", lit: "can (of-course)! but Bin read Vietnamese clever more uncle (you-see)."}
- {n: 6, speaker: Bin, vi: "Chú đọc với cháu được không ạ?", en: "Can you read with me?", lit: "uncle read with grandchild can not (polite)?"}
- {n: 7, speaker: Lan, vi: "Bin, con đọc với chú Sacha đi, rồi ăn cơm nhá!", en: "Bin, read with Sacha, then we'll eat, OK?", lit: "Bin, child read with uncle Sacha (urging), then eat rice OK!"}
- {n: 8, speaker: Bin, vi: "Mẹ ơi, con và Na đều đói rồi!", en: "Mum, Na and I are both hungry already!", lit: "mother hey, child and Na both hungry already!"}
- {n: 9, speaker: Lan, vi: "Đói rồi hả? Thôi, cả nhà ăn cơm đi!", en: "Hungry already, are you? Right, everyone, let's eat!", lit: "hungry already (eh)? stop, whole house eat rice (urging)!"}
- {n: 10, speaker: Bác, vi: "Sacha, cháu ngồi đây với bác. Hôm_nay có canh cháu thích nhất đấy!", en: "Sacha, sit here with me. Today there's the soup you like best!", lit: "Sacha, grandchild sit here with uncle-aunt. today have soup grandchild like most (you-see)!"}
notes:
- {ref: 1, topic: pronouns, text: "Chú ơi … Chú mua cho cháu ạ?: Na calls Sacha chú and herself cháu; he answers with the same pair (line 2). In line 7 Lan says chú Sacha to her son: grown-ups name each other the way the child would."}
- {ref: 0, topic: pronouns, text: "Pronouns so far (lessons 16, 19): chúng tôi \"we, not you\", chúng ta \"we, you included\"; cả nhà \"everyone (in the family)\". ông, bà \"you\" to the grandparents' generation, with cháu; cô, chú to the parents' generation, also with cháu; dạ answers them."}
- {ref: 0, topic: particles, text: "Particles of lessons 15–19: thôi \"only, that's all\" (hai triệu thôi), and Thôi, … \"right, …\" closing a matter (line 9); hả, the familiar question (Đói rồi hả?); nhá, the familiar nhé (line 7); với softening a plea (Giúp cháu với!); chứ \"of course\" (Được chứ!); dạ to elders."}
- {ref: 0, topic: grammar, text: "Comparison (lesson 15): adjective + hơn \"more, -er\" (giỏi hơn chú \"better than me\"); adjective + bằng \"as … as\"; adjective + nhất \"the most\": thích mèo nhất \"like cats best\", canh cháu thích nhất \"the soup you like best\" (line 10)."}
- {ref: 0, topic: grammar, text: "Classifiers (lesson 17): quyển for books (quyển sách này), tờ for newspapers, con for animals, chiếc for single objects and vehicles, cái for most things. Without a number or này / kia, a noun can stand alone: Cháu thích mèo \"I like cats\"."}
- {ref: 0, topic: grammar, text: "Can (lesson 18): có thể + verb (what is possible); verb + được, the everyday way, also asking a favour: Chú đọc với cháu được không ạ? (line 6); biết + verb, a skill learnt: biết bơi."}
- {ref: 0, topic: grammar, text: "cho (lessons 3, 19): \"give\", and \"for, to\" after a verb: mua cho cháu \"buy for you\", gửi cho sếp \"send to the boss\", kể cho cháu \"tell you\"."}
- {ref: 0, topic: grammar, text: "Lesson 20: cũng \"also\" and đều \"both, all\" go before the verb; đều needs a plural subject: Con và Na đều đói rồi (line 8). vừa … vừa: two things at once (vừa ăn vừa nói chuyện)."}
- {ref: 0, topic: bridge, text: "Initials so far, usually: c / k / q with Mandarin g- (canh 羹), kh with Mandarin k- and Cantonese h- (khách 客); h with Mandarin h- / x- (học 學); ph with Mandarin f- (phòng 房); m with m- (môn 門), v with Mandarin w- and Cantonese m- (văn 文); đ with d-, or t- in tone 2."}
