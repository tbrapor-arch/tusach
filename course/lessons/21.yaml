  - {vi: "Hôm_nay Thảo có_thể đến muộn.", en: "Thảo may be late today."}
  fill:
  - {vi: "Cho em hai ___ sách này.", answer: quyển, en: "Two of these books, please."}
  - {vi: "Cái áo này đẹp ___ cái áo kia.", answer: "bằng~equal", en: "This top is as pretty as that one."}
  - {vi: "Anh Minh ơi, tìm quyển từ_điển cho em ___!", answer: với, en: "Minh, please find the dictionary for me!"}
  - {vi: "Con ăn no rồi ___?", answer: hả, en: "Full already, are you? (a parent to a child)"}
