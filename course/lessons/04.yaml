id: 4
title: {vi: "Bao nhiêu tiền?", en: Paying at the tea stall}
review: false
setting: >-
  On the way home, Sacha, Thảo and Lan stop at a pavement tea stall: a kettle, a low table, tiny stools. Sacha wants
  to pay this time. The woman who runs the stall is about forty.
dialogue:
- {n: 1, speaker: Sacha, vi: "Chị ơi, một cốc trà đá~ice bao_nhiêu tiền?", en: "Excuse me, how much is a glass of iced tea?", lit: "elder-sister hey, one glass tea ice how-much money?"}
- {n: 2, speaker: Stall owner, vi: "Năm~five nghìn một cốc.", en: "Five thousand a glass.", lit: "five thousand one glass."}
- {n: 3, speaker: Sacha, vi: "Rẻ quá! Ở quán cà_phê, một cốc trà ba~three mươi lăm nghìn.", en: "That's so cheap! At the café a glass of tea is thirty-five thousand.", lit: "cheap so! at shop coffee, one glass tea three ten five thousand."}
- {n: 4, speaker: Stall owner, vi: "Ba~three mươi lăm nghìn à? Đắt quá!", en: "Thirty-five thousand? That's so expensive!", lit: "three ten five thousand (surprised)? expensive so!"}
- {n: 5, speaker: Sacha, vi: "Vâng. Cho em ba~three cốc trà đá~ice.", en: "Yes. Three iced teas, please.", lit: "yes. give younger-sibling three glass tea ice."}
- {n: 6, speaker: Stall owner, vi: "Ba~three cốc, mười lăm nghìn.", en: "Three glasses: fifteen thousand.", lit: "three glass, ten five thousand."}
- {n: 7, speaker: Sacha, vi: "Mười lăm nghìn ạ. Cảm_ơn chị!", en: "Fifteen thousand. Thank you!", lit: "ten five thousand (polite). thank elder-sister!"}
notes:
- {ref: 1, topic: grammar, text: "Một cốc trà đá bao nhiêu tiền? \"how much is a glass of iced tea?\": bao nhiêu \"how much\" + tiền \"money\", where the answer goes. A price needs no verb: Năm nghìn một cốc \"five thousand (for) one glass\"."}
- {ref: 1, topic: grammar, text: "một cốc trà đá, ba cốc: number + glass + drink. Once the drink is known, the glass alone is enough."}
- {ref: 2, topic: numbers, text: "1 một · 2 hai · 3 ba · 4 bốn · 5 năm · 6 sáu · 7 bảy · 8 tám · 9 chín · 10 mười · 100 trăm · 1,000 nghìn."}
- {ref: 3, topic: numbers, text: "Rule 1, tens: mười is 10 and starts 11–19 (mười hai 12); from 20 on, \"ten\" is mươi, level tone, after the number: hai mươi 20, ba mươi 30, hai mươi hai 22."}
- {ref: 3, topic: numbers, text: "Rule 2, big numbers: from the largest part down, as in English: một trăm năm mươi 150; ba mươi lăm nghìn 35,000. Prices are said in thousands."}
- {ref: 3, topic: numbers, text: "lăm: after mười or mươi, năm \"five\" becomes lăm: mười lăm 15, ba mươi lăm 35."}
- {ref: 0, topic: numbers, text: "mốt: after mươi, một \"one\" becomes mốt: hai mươi mốt 21. But mười một 11 keeps một. tư: after mươi, bốn \"four\" is often tư: hai mươi tư 24."}
- {ref: 3, topic: grammar, text: "Rẻ quá! \"so cheap!\": quá after an adjective is often an exclamation; before it (quá đắt) it often means \"too (expensive)\". đắt \"expensive\", rẻ \"cheap\"."}
- {ref: 1, topic: bridge, text: "tiền is 錢 (Mandarin qián). Hán-Việt keeps the old final stops that Mandarin lost, as Cantonese does: 學 học (Mandarin xué, Cantonese hok6)."}
