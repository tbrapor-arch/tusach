- {w: năm, tag: five, en: five}
- {w: sáu, en: six}
- {w: bảy, en: seven}
- {w: tám, en: eight}
- {w: chín, en: nine}
- {w: mười, en: ten}
- {w: mươi, en: "ten (in tens from twenty on: hai mươi)"}
- {w: lăm, en: "five (after mười and mươi)"}
- {w: mốt, en: "one (after mươi)"}
- {w: tư, en: "four (after mươi, and in thứ tư, phần tư)"}
- {w: trăm, en: hundred}
- {w: nghìn, en: thousand}
- {w: bao_nhiêu, en: "how much, how many"}
- {w: tiền, en: money}
- {w: đắt, en: expensive}
- {w: rẻ, en: cheap}
- {w: quá, en: "too, very (much); to go past"}
exercises:
  translate:
  - {vi: "Cà_phê ở quán này bao_nhiêu tiền?", en: "How much is coffee at this café?"}
  - {vi: "Ba~three mươi mốt nghìn.", en: "Thirty-one thousand."}
  - {vi: "Bốn mươi tư nghìn một cốc.", en: "Forty-four thousand a glass."}
  - {vi: "Đắt quá, một trăm sáu mươi nghìn!", en: "So expensive: a hundred and sixty thousand!"}
  - {vi: "Bảy cốc trà là ba~three mươi lăm nghìn.", en: "Seven glasses of tea come to thirty-five thousand."}
  - {vi: "Cà_phê sữa đá~ice ở Pháp không rẻ.", en: "Iced coffee with milk is not cheap in France."}
  fill:
  - {vi: "Hai mươi ___ nghìn.", answer: lăm, en: "Twenty-five thousand."}
  - {vi: "Một cốc sữa ___ tiền?", answer: "bao nhiêu", en: "How much is a glass of milk?"}
  - {vi: "Trà ở quán này ___ quá!", answer: rẻ, en: "The tea at this café is so cheap!"}
  - {vi: "Tám mươi ___ nghìn.", answer: chín, en: "Eighty-nine thousand."}
