id: 24
title: {vi: Học lái xe máy, en: Learning to ride a motorbike}
review: false
setting: >-
  Sunday morning, early, before the streets fill up. Anh Minh has offered to teach Sacha to ride his motorbike. They
  start in the courtyard; the house opens onto a quiet lane, which leads to a busier street.
dialogue:
- {n: 1, speaker: Minh, vi: "Sacha, hôm_nay anh dạy em lái xe_máy nhé. Mũ_bảo_hiểm đây.", en: "Sacha, today I'll teach you to ride the motorbike. Here's a helmet.", lit: "Sacha, today elder-brother teach younger-sibling drive motorbike OK. helmet here."}
- {n: 2, speaker: Sacha, vi: "Cảm_ơn anh. Em chưa có kinh_nghiệm, em hơi sợ.", en: "Thanks. I've no experience: I'm a bit scared.", lit: "thank elder-brother. younger-sibling not-yet have experience, younger-sibling slightly fear."}
- {n: 3, speaker: Minh, vi: "Bình_tĩnh! Em lên xe_máy đi, anh ngồi sau.", en: "Stay calm! Get on, I'll sit behind.", lit: "calm! younger-sibling go-up motorbike (urging), elder-brother sit behind."}
- {n: 4, speaker: Sacha, vi: "Em đi ra ngõ ạ?", en: "Do I go out into the lane?", lit: "younger-sibling go out lane (polite)?"}
- {n: 5, speaker: Minh, vi: "Đi ra ngõ, rồi rẽ phải~right, sang phố kia. Đi chậm thôi!", en: "Out into the lane, then turn right and cross to that street. Slowly!", lit: "go out lane, then turn right, cross street that. go slow only!"}
- {n: 6, speaker: Sacha, vi: "Anh ơi, xe_máy nhiều quá! Giao_thông Hà_Nội nguy_hiểm lắm.", en: "So many motorbikes! The traffic in Hà Nội is really dangerous.", lit: "elder-brother hey, motorbike many so! traffic Hà Nội dangerous very."}
- {n: 7, speaker: Minh, vi: "Chú_ý! Xe_máy ở trước! Phanh đi!", en: "Watch out! There's a motorbike in front! Brake!", lit: "pay-attention! motorbike at front! brake (urging)!"}
- {n: 8, speaker: Sacha, vi: "Em phanh rồi. Tốc_độ này được không ạ?", en: "I've braked. Is this speed all right?", lit: "younger-sibling brake already. speed this can not (polite)?"}
- {n: 9, speaker: Minh, vi: "Được. Cẩn_thận, đừng ngã nhé! Bây_giờ đi về nhà.", en: "Fine. Careful, don't fall off! Now let's go home.", lit: "can. careful, don't fall OK! now go return house."}
- {n: 10, speaker: Sacha, vi: "Về nhà rồi! Em xuống đây ạ.", en: "We're home! I'll get off here.", lit: "return house already! younger-sibling go-down here (polite)."}
- {n: 11, speaker: Minh, vi: "Giỏi lắm! Vào nhà đi. Ngày_mai em chở anh đi làm nhé!", en: "Well done! Let's go in. Tomorrow you can take me to work!", lit: "clever very! enter house (urging). tomorrow younger-sibling carry elder-brother go work OK!"}
notes:
- {ref: 1, topic: usage, text: "lái \"to drive, to ride\": lái xe máy \"to ride a motorbike\". mũ bảo hiểm \"helmet\" (mũ \"hat\" + bảo hiểm \"insurance, protection\"): required on every motorbike in Vietnam."}
- {ref: 2, topic: grammar, text: "Em chưa có kinh nghiệm \"I have no experience yet\": chưa \"not yet\" before có. kinh nghiệm \"experience\". Bình tĩnh! (line 3) \"stay calm!\"."}
- {ref: 3, topic: grammar, text: "Direction verbs: lên \"to go up, to get on\" (lên xe máy), xuống \"to go down, to get off\" (Em xuống đây, line 10), ra \"to go out\", vào \"to go in\" (Vào nhà đi!, line 11), về \"to go back, home\", sang \"to cross, to go over\" (sang phố kia, line 5)."}
- {ref: 4, topic: grammar, text: "Em đi ra ngõ: after đi (or another verb of movement), ra, vào, lên, xuống, về, sang give the direction: đi ra \"go out\", đi vào \"go in\", đi về \"go back\". ngõ \"a lane\": Hà Nội houses stand on a ngõ off a phố."}
- {ref: 5, topic: particles, text: "Đi chậm thôi! \"slowly now!\": thôi after an order softens it, \"just\". chậm \"slow, slowly\", the opposite of nhanh."}
- {ref: 7, topic: grammar, text: "Chú ý! \"watch out!\": chú ý \"to pay attention (to)\". Xe máy ở trước \"a motorbike in front\": trước \"in front (of); before\", sau \"behind; after\" (line 3). Phanh đi! \"brake!\": phanh \"brake; to brake\" (from French frein)."}
- {ref: 8, topic: usage, text: "Tốc độ này được không? \"is this speed all right?\": tốc độ \"speed\"; được alone is \"all right, OK\" (Được. line 9). giao thông \"traffic\" (line 6)."}
- {ref: 9, topic: grammar, text: "Cẩn thận, đừng ngã nhé! \"careful, don't fall!\": cẩn thận \"careful\"; ngã \"to fall\" (also the name of the tone ngã). Ngày mai em chở anh đi làm (line 11): chở \"to carry, to give (someone) a lift\" on a motorbike."}
- {ref: 7, topic: bridge, text: "tr and ch: Mandarin zh- usually gives ch or tr, and Taigi often decides: chú ý is 注意 (Mandarin zhùyì, Taigi tsù-ì): with Taigi ts-, ch. 中 trung (Mandarin zhōng, Taigi tiong), as in trung tâm: with Taigi t-, tr."}
