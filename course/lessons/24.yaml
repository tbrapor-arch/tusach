exercises:
  translate:
  - {vi: "Bà đi ra chợ, chín giờ về.", en: "Grandma is going out to the market; she'll be back at nine."}
  - {vi: "Thảo lên tầng ba~three, Sacha xuống bếp.", en: "Thảo goes up to the third floor; Sacha goes down to the kitchen."}
  - {vi: "Anh Minh lái xe_máy nhanh quá!", en: "Minh rides the motorbike so fast!"}
  - {vi: "Ngày_mai anh chở em đến trường nhé.", en: "I'll give you a lift to school tomorrow. (to someone younger)"}
  - {vi: "Ở ngõ này có một quán phở ngon.", en: "There's a good phở place in this lane."}
  fill:
  - {vi: "Mời bác ___ nhà ạ.", answer: vào, en: "Please come in. (to an older person)"}
  - {vi: "Tuần sau tôi ___ Pháp.", answer: về, en: "Next week I'm going back to France."}
  - {vi: "Anh Minh ơi, lái ___ thôi!", answer: chậm, en: "Minh, ride more slowly!"}
