exercises:
  translate:
  - {vi: "Bin và Na đều thích mèo.", en: "Bin and Na both like cats."}
  - {vi: "Chị Lan vừa nấu cơm vừa nghe nhạc.", en: "Lan listens to music while she cooks."}
  - {vi: "Mấy giờ anh Tuấn đến văn_phòng?", en: "What time does Tuấn get to the office?"}
  - {vi: "Hôm_qua tôi làm_việc muộn, chín giờ tối mới về nhà.", en: "Yesterday I worked late: I only got home at nine in the evening."}
  - {vi: "Mai gửi báo_cáo cho anh Tuấn rồi.", en: "Mai has sent the report to Tuấn."}
  fill:
  - {vi: "Anh Minh và chị Lan ___ làm ở Hà_Nội.", answer: đều, en: "Minh and Lan both work in Hà Nội."}
  - {vi: "Na vừa ăn ___ xem phim.", answer: vừa, en: "Na eats while she watches a film."}
  - {vi: "Bin là học_sinh ___ đến trường.", answer: đầu_tiên, en: "Bin is the first pupil to arrive at school."}
