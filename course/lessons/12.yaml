- {w: đau, en: "to hurt, painful"}
- {w: đầu, en: "head; beginning, first (part)"}
- {w: bị, en: "(passive, for something bad) to suffer, to get; to be (…ed)"}
- {w: cảm, en: "to feel; (to catch) a cold"}
- {w: bác_sĩ, en: "doctor (physician)"}
- {w: thuốc, en: "medicine; tobacco"}
- {w: nghỉ, en: "to rest; to take time off"}
- {w: nên, en: "should; so, therefore"}
- {w: phải, tag: must, en: "must, to have to"}
- {w: khỏe, en: "well, healthy; strong"}
