exercises:
  translate:
  - {vi: "Chị Lan bị ốm, hôm_nay chị ấy nghỉ ở nhà.", en: "Lan is ill: she's staying at home today."}
  - {vi: "Sao~why em buồn thế?", en: "Why are you so sad? (to someone younger)"}
  - {vi: "Thuốc này rất tốt.", en: "This medicine is very good."}
  - {vi: "Bin bị cảm. Hai ngày sau, Bin đi học.", en: "Bin had a cold. Two days later, he went to school."}
  - {vi: "Tại_sao anh Minh không ăn phở?", en: "Why isn't Minh eating phở?"}
  fill:
  - {vi: "Em ___ uống thuốc.", answer: nên, en: "You should take some medicine. (to someone younger)"}
  - {vi: "Hôm_nay chị Lan không đi làm, ___ chị ấy bị ốm.", answer: vì, en: "Lan isn't going to work today, because she's ill."}
  - {vi: "Em không mệt ___!", answer: đâu, en: "I'm not tired at all! (to someone older)"}
