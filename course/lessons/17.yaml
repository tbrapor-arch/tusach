exercises:
  translate:
  - {vi: "Anh Minh đọc báo ở quán cà_phê.", en: "Minh reads the paper at the café."}
  - {vi: "Bin có hai quyển từ_điển.", en: "Bin has two dictionaries."}
  - {vi: "Phim này hay~good lắm, em xem đi!", en: "This film is really good: watch it! (to someone younger)"}
  - {vi: "Chị Lan viết tên Na trên quyển sách.", en: "Lan writes Na's name on the book."}
  - {vi: "Hiệu_sách này có bán sách tiếng_Việt không?", en: "Does this bookshop sell Vietnamese books?"}
  fill:
  - {vi: "Bà ơi, giúp cháu ___!", answer: với, en: "Grandma, please help me!"}
  - {vi: "Na thích con ___ đen.", answer: mèo, en: "Na likes the black cat."}
  - {vi: "Anh Minh mua hai ___ báo.", answer: tờ, en: "Minh buys two newspapers."}
