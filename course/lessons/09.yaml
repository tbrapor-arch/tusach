exercises:
  translate:
  - {vi: "Hôm_nay trời không lạnh.", en: "It isn't cold today."}
  - {vi: "Ảnh này đẹp lắm!", en: "This photo is really lovely!"}
  - {vi: "Trời mưa, nhưng Thảo đi học.", en: "It's raining, but Thảo is going to class."}
  - {vi: "Mùa hè ở Pháp thế_nào?", en: "What is summer like in France?"}
  - {vi: "Cốc cà_phê này hơi đắt.", en: "This coffee is a bit expensive."}
  - {vi: "Nhà chị Lan có nhiều ảnh.", en: "Lan's house has a lot of photos."}
  fill:
  - {vi: "Hồ Hoàn_Kiếm đẹp ___!", answer: nhỉ, en: "Hoàn Kiếm lake is lovely, isn't it!"}
  - {vi: "Mùa ___ ở Hà_Nội nóng lắm.", answer: hè, en: "Summer in Hà Nội is very hot."}
  - {vi: "Phố này ___ xa.", answer: hơi, en: "This street is a bit far."}
