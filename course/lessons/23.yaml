  - {vi: "Chủ_nhà sống ở tầng một.", en: "The landlady lives on the ground floor."}
  - {vi: "Các bạn ơi, chúng_ta đi ăn phở nhé!", en: "Hey everyone, let's go and eat phở!"}
  - {vi: "Phòng_ngủ của Bin nhỏ hơn phòng_ngủ của bà.", en: "Bin's bedroom is smaller than Grandma's."}
  - {vi: "Trong bếp có mèo.", en: "There's a cat in the kitchen."}
  fill:
  - {vi: "___ người đều thích Na.", answer: mọi, en: "Everybody likes Na."}
  - {vi: "Phố này ồn quá, phố kia ___ hơn.", answer: yên_tĩnh, en: "This street is so noisy; that one is quieter."}
  - {vi: "Thảo muốn ___ một phòng gần trường.", answer: thuê, en: "Thảo wants to rent a room near her university."}
