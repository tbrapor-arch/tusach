exercises:
  translate:
  - {vi: "Hôm_qua tôi được bố mẹ tặng một cái ví~wallet mới.", en: "Yesterday my parents gave me a new wallet."}
  - {vi: "Anh ấy được công_ty thưởng năm~five triệu.", en: "His company gave him a bonus of five million."}
  - {vi: "Ngân_hàng này mở lúc tám giờ sáng.", en: "This bank opens at eight in the morning."}
  - {vi: "Tôi không đủ tiền mua xe_máy mới.", en: "I don't have enough money to buy a new motorbike."}
  - {vi: "Chị đưa thẻ cho em nhé.", en: "Give me the card, OK? (to a younger woman, speaking to an older one)"}
  fill:
  - {vi: "Na ___ giáo_viên khen.", answer: "được", en: "Na was praised by the teacher."}
  - {vi: "Anh muốn ___ tiền ở máy này à?", answer: "rút", en: "Do you want to take out money at this machine?"}
  - {vi: "Em phải~must ___ ở quầy số hai.", answer: "xếp_hàng", en: "You have to queue at counter two."}
doubt:
- {line: 3, text: "Is được trả tiền_lương natural for 'get paid', or would nhận lương be the everyday phrase?"}
- {line: 8, text: "được chuyển tiền miễn_phí: natural in a bank clerk's mouth?"}
- {line: 12, text: "Mai and Sacha (same age, colleagues) use anh / em here: would bạn / mình or tớ / cậu be more likely?"}
