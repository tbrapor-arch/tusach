exercises:
  translate:
  - {vi: "Chúc_mừng sinh_nhật em! Chúc~wish em luôn vui.", en: "Happy birthday! I hope you're always happy."}
  - {vi: "Chị Lan đang dọn bếp, còn anh Minh đi mua hoa.", en: "Lan is tidying the kitchen, and Minh has gone to buy flowers."}
  - {vi: "Tàu sắp~about chạy, anh nhanh lên!", en: "The train is about to leave, hurry up!"}
  - {vi: "Cây đào~peach ở sân nhà ông Hùng to lắm.", en: "The peach tree in ông Hùng's yard is very big."}
  - {vi: "Các cháu ngoan thì bà cho tiền lì_xì.", en: "If you children are good, Grandma will give you lucky money."}
  fill:
  - {vi: "Phim ___ bắt_đầu, chúng_ta vào rạp đi.", answer: "sắp~about", en: "The film is about to start; let's go into the cinema."}
  - {vi: "Cháu ___ ông năm_mới sức_khỏe!", answer: "chúc~wish", en: "Grandpa, I wish you good health in the new year!"}
  - {vi: "Hôm_qua bà dạy Na ___ bánh_chưng.", answer: "gói", en: "Yesterday Grandma taught Na to wrap bánh chưng."}
doubt:
- {line: 8, text: "mình as inclusive 'we' from a child to her grandmother: natural here, or would Na say cả nhà?"}
- {line: 11, text: "Cháu bà ngoan quá!: natural fond address from a Northern grandmother?"}
- {line: 12, text: "Sacha wishes thành_công, may_mắn to Lan and Minh: is that the usual pair for adults, or would an_khang thịnh_vượng be expected?"}
- {line: 0, text: "Setting says late January: Tết dates vary; is 'a week before Tết' enough?"}
