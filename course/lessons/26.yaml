id: 26
title: {vi: Sở thích, en: Hobbies}
review: false
setting: >-
  Friday afternoon, the tea break at the office. Mai, Sacha and anh Tuấn talk about what they do at weekends. Tuấn,
  who is 41, belongs to a hiking club.
dialogue:
- {n: 1, speaker: Mai, vi: "Sacha ơi, cuối_tuần bạn thường làm gì?", en: "Sacha, what do you usually do at the weekend?", lit: "Sacha hey, weekend you usually do what?"}
- {n: 2, speaker: Sacha, vi: "Tôi thường chạy ở hồ Hoàn_Kiếm. Thỉnh_thoảng tôi đi rạp xem phim.", en: "I usually go running at Hoàn Kiếm lake. Sometimes I go to the cinema.", lit: "I usually run at lake Hoàn Kiếm. sometimes I go cinema watch film."}
- {n: 3, speaker: Mai, vi: "Tôi thì ít_khi chạy. Sở_thích của tôi là âm_nhạc: tôi hay~often hát và nhảy.", en: "I rarely run. My hobby is music: I often sing and dance.", lit: "I (as-for) rarely run. hobby of I be music: I often sing and dance."}
- {n: 4, speaker: Tuấn, vi: "Hai em đã từng leo núi chưa?", en: "Have you two ever been hiking in the mountains?", lit: "two younger-sibling (past) ever climb mountain not-yet?"}
- {n: 5, speaker: Sacha, vi: "Em đã từng leo núi ở Pháp, nhưng ở Việt_Nam thì chưa.", en: "I've been hiking in France, but not yet in Vietnam.", lit: "younger-sibling (past) ever climb mountain at France, but at Vietnam then not-yet."}
- {n: 6, speaker: Tuấn, vi: "Anh tham_gia một câu_lạc_bộ leo núi. Tháng sau chúng_ta đi nhé?", en: "I belong to a hiking club. Shall we go next month?", lit: "elder-brother take-part one club climb mountain. month after we-all go OK?"}
- {n: 7, speaker: Mai, vi: "Tháng sau em bận lắm, anh ạ. Em không có thời_gian.", en: "I'm very busy next month. I haven't got the time.", lit: "month after younger-sibling busy very, elder-brother (polite). younger-sibling not have time."}
- {n: 8, speaker: Tuấn, vi: "Sacha thì sao~why?", en: "What about you, Sacha?", lit: "Sacha then how?"}
- {n: 9, speaker: Sacha, vi: "Em muốn đi lắm! Em thích vẽ, em sẽ vẽ núi Việt_Nam.", en: "I'd love to go! I like drawing: I'll draw the mountains of Vietnam.", lit: "younger-sibling want go very! younger-sibling like draw, younger-sibling will draw mountain Vietnam."}
- {n: 10, speaker: Tuấn, vi: "Hay~good quá! Anh thì tối thứ_bảy luôn xem bóng_đá, nhưng không biết vẽ.", en: "Great! Me, I always watch football on Saturday evenings, but I can't draw.", lit: "good so! elder-brother (as-for) evening Saturday always watch football, but not know draw."}
- {n: 11, speaker: Mai, vi: "Thế thì lần sau em cũng đi!", en: "In that case, next time I'm coming too!", lit: "so then time after younger-sibling also go!"}
notes:
- {ref: 1, topic: grammar, text: "How often, before the verb: luôn \"always\" (line 10), thường \"usually\", hay \"often\" (line 3), thỉnh thoảng \"sometimes\" (at the start or before the verb), ít khi \"rarely\". Bạn thường làm gì? \"what do you usually do?\"."}
- {ref: 2, topic: usage, text: "chạy \"to run\": chạy ở hồ \"to go running at the lake\". đi rạp xem phim \"to go to the cinema\": rạp \"cinema, theatre\", in full {rạp chiếu phim}."}
- {ref: 3, topic: grammar, text: "Sở thích của tôi là âm nhạc \"my hobby is music\": sở thích \"hobby\", âm nhạc \"music\" (as an art; to listen to music is nghe nhạc, lesson 20). hát \"to sing\", nhảy \"to dance\"."}
- {ref: 3, topic: usage, text: "hay is three words: \"often\" before a verb (tôi hay hát); \"or\" between two choices (lesson 11); \"good, interesting\" after a noun or in Hay quá! \"great!\" (line 10)."}
- {ref: 4, topic: grammar, text: "Hai em đã từng leo núi chưa? \"have you ever been hiking?\": đã từng + verb is \"to have ever …, to have once …\"; with chưa it asks. The answer: Em đã từng … or Chưa. leo \"to climb\", núi \"mountain\": leo núi \"to go hiking in the mountains\"."}
- {ref: 5, topic: grammar, text: "ở Việt Nam thì chưa \"but not yet in Vietnam\": thì sets this part against the first (lesson 22). In Sacha thì sao? (line 8), \"what about Sacha?\", it brings in the next person."}
- {ref: 6, topic: grammar, text: "tham gia \"to take part in, to join\": tham gia câu lạc bộ \"to belong to a club\". câu lạc bộ \"club\". Tháng sau \"next month\", like tuần sau."}
- {ref: 7, topic: grammar, text: "Em không có thời gian \"I haven't got the time\": thời gian \"time\" (an amount of it); giờ is the hour. Line 11: Thế thì \"in that case, so\"; lần sau \"next time\"."}
- {ref: 3, topic: bridge, text: "nh, d and no initial: âm is 音 (Mandarin yīn, Cantonese jam1): no initial usually answers Mandarin y- or w- with a Cantonese tone 1, 2 or 3. nh answers Mandarin r-: 人 nhân (Mandarin rén), as in nhân viên. d often answers Mandarin y- with Cantonese j- in a low tone: du lịch is 遊歷 (yóulì, Cantonese jau4)."}
new_words:
