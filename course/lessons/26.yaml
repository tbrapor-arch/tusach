- {w: hay, tag: often, en: often}
- {w: luôn, en: "always; at once; (after a verb) as well"}
- {w: bóng_đá, en: football}
- {w: chạy, en: to run}
- {w: leo, en: to climb}
- {w: núi, en: mountain}
- {w: vẽ, en: "to draw, to paint"}
- {w: hát, en: to sing}
- {w: rạp, en: "theater, cinema (a movie theater)"}
- {w: thỉnh_thoảng, en: "sometimes, now and then"}
- {w: ít_khi, en: "rarely, seldom"}
- {w: nhảy, en: "to dance; to jump"}
- {w: thường, en: "usually, often; ordinary"}
- {w: sở_thích, en: "hobby, pastime"}
- {w: âm_nhạc, en: "music (as an art, a subject)"}
