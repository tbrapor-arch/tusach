exercises:
  translate:
  - {vi: "Bin thường đi học lúc bảy giờ.", en: "Bin usually goes to school at seven."}
  - {vi: "Chị Lan đã từng sống ở Pháp.", en: "Lan once lived in France."}
  - {vi: "Ông Hùng luôn uống trà với bạn.", en: "Ông Hùng always drinks tea with his friends."}
  - {vi: "Thỉnh_thoảng Thảo đi bơi với Sacha.", en: "Sometimes Thảo goes swimming with Sacha."}
  - {vi: "Na thích hát, Bin thích bóng_đá.", en: "Na likes singing; Bin likes football."}
  fill:
  - {vi: "Anh đã ___ ăn bún_chả chưa?", answer: từng, en: "Have you ever eaten bún chả? (to a young man a little older)"}
  - {vi: "Chị Lan ___ uống cà_phê.", answer: ít_khi, en: "Lan rarely drinks coffee."}
  - {vi: "Anh Minh không có ___ đọc sách.", answer: thời_gian, en: "Minh has no time to read."}
