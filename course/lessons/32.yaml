exercises:
  translate:
  - {vi: "Dì của tôi là em_gái của mẹ tôi.", en: "My aunt is my mother's younger sister."}
  - {vi: "Cậu của Bin làm ở ngân_hàng.", en: "Bin's uncle (his mother's brother) works at a bank."}
  - {vi: "Tết này chị về quê ngoại~maternal à?", en: "Are you going to your mother's home village this Tết?"}
  - {vi: "Anh_rể của em là bác_sĩ.", en: "My brother-in-law is a doctor."}
  - {vi: "Bà_nội thắp hương~incense mỗi sáng.", en: "Grandma (Dad's mother) lights incense every morning."}
  fill:
  - {vi: "Mẹ của mẹ tôi là ___ của tôi.", answer: "bà_ngoại", en: "My mother's mother is my grandmother."}
  - {vi: "Chồng của chị_gái tôi là ___ của tôi.", answer: "anh_rể", en: "My elder sister's husband is my brother-in-law."}
  - {vi: "Ngày_mai chúng_tôi đi ___ họ_hàng.", answer: "thăm~visit", en: "Tomorrow we're going to visit relatives."}
doubt:
- {line: 4, text: "Sacha greets Minh's parents as ông / bà: right for people in their sixties, or would bác be expected?"}
- {line: 8, text: "Minh calls himself bố to his daughter and Thảo dì Thảo: is dì the Northern word here, or would the children say cô Thảo?"}
- {line: 9, text: "thắp hương~incense ở bàn_thờ tổ_tiên: is ở right, or trên / lên bàn thờ?"}
- {line: 0, text: "The lexicon rows for nội (hv-opaque 內) and ngoại (hv 外) are Claude's; please check the labels."}
