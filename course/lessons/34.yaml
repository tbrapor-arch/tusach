- {w: đá, tag: kick, en: "to kick; to play (football)"}
- {w: Thái_Lan, name: true, en: "Thailand"}
- {w: sân_vận_động, en: "stadium"}
- {w: ti_vi, en: "TV, television"}
- {w: cổ_vũ, en: "to cheer, to support"}
- {w: đội, tag: team, en: "team"}
- {w: cầu_thủ, en: "player (football)"}
- {w: ghi_bàn, en: "to score a goal"}
- {w: bàn, tag: goal, en: "goal (in football)"}
- {w: trọng_tài, en: "referee"}
- {w: tại_vì, en: "because"}
- {w: tiếc, en: "to be sorry, to regret: tiếc quá! what a pity!"}
- {w: trận, tag: match, en: "match, game"}
