exercises:
  translate:
  - {vi: "Vì trời mưa nên trận~match bóng_đá bắt_đầu muộn.", en: "Because it was raining, the football match started late."}
  - {vi: "Tuấn không đi làm, tại_vì anh ấy ốm.", en: "Tuấn didn't go to work, because he was ill."}
  - {vi: "Bin thích xem phim buồn_cười trên ti_vi.", en: "Bin likes watching funny films on TV."}
  - {vi: "Mọi người hét~shout to quá, em không nghe được.", en: "Everyone is shouting so loud, I can't hear."}
  - {vi: "Đội~team của Na thua, nhưng Na không buồn.", en: "Na's team lost, but she isn't sad."}
  fill:
  - {vi: "Vì anh bận ___ anh không đến được.", answer: "nên", en: "I'm busy, so I can't come."}
  - {vi: "Hôm_qua đội~team Hà_Nội ___ hai – một.", answer: "thắng~win", en: "Yesterday the Hà Nội team won two–one."}
  - {vi: "Cầu_thủ số chín ___ hai lần.", answer: "ghi_bàn", en: "Number nine scored twice."}
doubt:
- {line: 3, text: "vì … nên with two reasons (vé đắt và khó mua): natural in speech?"}
- {line: 9, text: "đá ngã cầu_thủ Thái_Lan 'kicked a Thai player over': natural, or phạm lỗi với …?"}
- {line: 10, text: "thua không – một (changed from một – không: the subject's goals first, as in the press 0-1): right in speech? Is 'Hết trận rồi' natural for 'the match is over'?"}
- {line: 0, text: "Lexicon row thắng~win (hv 勝) is Claude's: the dictionary card gave 'brake'."}
