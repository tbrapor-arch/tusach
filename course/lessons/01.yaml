id: 1
title: {vi: Chào chị, en: Hello}
review: false
setting: >-
  Hà Nội, a September evening. Sacha, 27, from Lyon, arrives with two suitcases at the family house near the Old
  Quarter where he has rented a room. Chị Lan, about 35, opens the door and takes one of his bags.
dialogue:
- {n: 1, speaker: Sacha, vi: "Chào chị ạ! Tôi tên là Sacha.", en: "Hello! My name is Sacha.", lit: "greet elder-sister (polite)! I name be Sacha."}
- {n: 2, speaker: Lan, vi: "Chào em!", en: "Hi!", lit: "greet younger-sibling!"}
- {n: 3, speaker: Sacha, vi: "Chị tên là gì ạ?", en: "What's your name, please?", lit: "elder-sister name be what (polite)?"}
- {n: 4, speaker: Lan, vi: "Chị tên là Lan.", en: "My name's Lan.", lit: "elder-sister name be Lan."}
- {n: 5, speaker: Sacha, vi: "Vâng. Cảm_ơn chị ạ!", en: "Right. Thank you!", lit: "yes. thank elder-sister (polite)!"}
- {n: 6, speaker: Lan, vi: "Không_có_gì. Rất vui được gặp em.", en: "You're welcome. Nice to meet you.", lit: "nothing. very glad get meet younger-sibling."}
- {n: 7, speaker: Sacha, vi: "Em rất vui được gặp chị ạ.", en: "I'm very glad to meet you.", lit: "younger-sibling very glad get meet elder-sister (polite)."}
notes:
- {ref: 1, topic: pronouns, text: "chị, anh, em: there is no all-purpose \"you\". You call people by a kinship word chosen by age: chị \"elder sister\" for a woman a little older, anh \"elder brother\" for a man a little older, em \"younger sibling\" for anyone younger. Sacha guesses that Lan is older: she is chị."}
- {ref: 1, topic: pronouns, text: "tôi: the neutral \"I\". Polite and safe with a stranger, but distant."}
- {ref: 1, topic: particles, text: "ạ at the end of a sentence marks politeness, typically toward elders and in service (staff say it to customers). As a learner, use it with anyone older than you."}
- {ref: 1, topic: grammar, text: "Chào chị! \"Hello!\": chào + the person you greet. The same words say goodbye."}
- {ref: 2, topic: pronouns, text: "Chào em! The words come in pairs: Lan, the older one, calls Sacha em and herself chị. So Chị tên là Lan (line 4) is \"elder sister's name is Lan\", that is, \"my name is Lan\"."}
- {ref: 3, topic: grammar, text: "Chị tên là gì? \"your name is what?\": gì \"what\" stands where the answer goes (Chị tên là Lan). là joins two nouns: A là B, \"A is B\"."}
- {ref: 5, topic: usage, text: "vâng: the polite \"yes\", also \"right, I see\". Cảm ơn chị \"thank you\": cảm ơn + the person. The answer: Không có gì, \"(it's) nothing\" (line 6)."}
- {ref: 6, topic: grammar, text: "Rất vui được gặp em: the set phrase \"nice to meet you\". rất \"very\" goes before vui \"glad\", with no là; được gặp is \"get to meet\"."}
- {ref: 7, topic: pronouns, text: "Em rất vui …: Lan has said chị and em, so Sacha now calls himself em. Going on with tôi to her would sound cold."}
new_words:
- {w: chào, en: "hello; goodbye; to greet"}
- {w: tôi, en: "I, me (neutral)"}
- {w: anh, en: "elder brother; you (to a young man a little older); I (said by him)"}
- {w: chị, en: "elder sister; you (to a young woman a little older); I (said by her)"}
- {w: em, en: "younger sibling; you (to someone younger); I (to someone older)"}
- {w: là, en: "to be (noun = noun)"}
- {w: tên, en: "name; to be called (tên là)"}
- {w: gì, en: what}
- {w: ạ, en: "(polite final particle, to older people)"}
- {w: vâng, en: "yes (polite)"}
- {w: cảm_ơn, en: "thank you; to thank"}
- {w: không_có_gì, en: "you're welcome; nothing"}
- {w: rất, en: very}
- {w: vui, en: "happy, glad; fun"}
- {w: được, en: "to get, to obtain; can, may; to be allowed to"}
- {w: gặp, en: to meet}
- {w: Sacha, en: "Sacha (the learner in the dialogues)", name: true}
- {w: Lan, en: "Lan (a woman's name)", name: true}
exercises:
  translate:
  - {vi: "Chào anh ạ!", en: "Hello! (politely, to a young man a little older)"}
  - {vi: "Tôi tên là Lan.", en: "My name is Lan. (neutral)"}
  - {vi: "Cảm_ơn em!", en: "Thank you! (to someone younger)"}
  - {vi: "Tôi rất vui được gặp anh.", en: "I'm very glad to meet you. (neutral, to a man a little older)"}
  - {vi: "Chị Lan rất vui.", en: "Lan is very happy."}
  fill:
  - {vi: "Em ___ là Sacha.", answer: tên, en: "My name is Sacha."}
  - {vi: "___ anh ạ!", answer: "Cảm ơn", en: "Thank you! (politely, to a young man a little older)"}
  - {vi: "Tôi ___ vui được gặp chị Lan.", answer: rất, en: "I'm very glad to meet you, Lan. (neutral)"}
