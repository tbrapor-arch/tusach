exercises:
  translate:
  - {vi: "Chị có muốn uống trà không?", en: "Would you like some tea? (to a young woman a little older)"}
  - {vi: "Cho tôi ba~three cốc cà_phê.", en: "Three coffees, please."}
  - {vi: "Em không phải~right là người Hà_Nội.", en: "I'm not from Hà Nội. (to someone older)"}
  - {vi: "Chị Lan uống trà và cà_phê.", en: "Lan drinks tea and coffee."}
  - {vi: "Anh muốn uống cà_phê phải~right không?", en: "You want a coffee, right?"}
  fill:
  - {vi: "Chị ___! Cho em hai cốc trà.", answer: ơi, en: "Excuse me! Two glasses of tea, please. (to an older woman)"}
  - {vi: "Quán này ___ sữa không?", answer: có, en: "Does this café have milk?"}
  - {vi: "Chị là người Hà_Nội ___ không?", answer: "phải~right", en: "You're from Hà Nội, aren't you? (to a young woman a little older)"}
