exercises:
  translate:
  - {vi: "Chị có muốn uống trà không?", en: "Would you like some tea? (to a young woman a little older)"}
  - {vi: "Cho tôi ba~three cốc cà_phê.", en: "Three coffees, please."}
  - {vi: "Thảo không phải~right là người Pháp.", en: "Thảo isn't French."}
  - {vi: "Chị Lan uống trà và cà_phê.", en: "Lan drinks tea and coffee."}
  - {vi: "Anh muốn uống cà_phê phải~right không?", en: "You want a coffee, right?"}
