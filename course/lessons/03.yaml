id: 3
title: {vi: Ở quán cà phê, en: At the café}
review: false
setting: >-
  Saturday afternoon. Thảo takes Sacha to a small café near her sister's house. They sit on low plastic stools on the
  pavement; a young waiter comes over.
dialogue:
- {n: 1, speaker: Sacha, vi: "Quán này có trà không em?", en: "Do they have tea here?", lit: "café this have tea not, younger-sibling?"}
- {n: 2, speaker: Thảo, vi: "Có. Anh không uống cà_phê à?", en: "Yes. Don't you drink coffee?", lit: "have. elder-brother not drink coffee (surprised)?"}
- {n: 3, speaker: Sacha, vi: "Có. Anh muốn một cà_phê sữa đá~ice. Em uống gì?", en: "I do. I'd like an iced coffee with milk. What will you have?", lit: "have. elder-brother want one coffee milk ice. younger-sibling drink what?"}
- {n: 4, speaker: Thảo, vi: "Em uống trà đá~ice.", en: "I'll have an iced tea.", lit: "younger-sibling drink tea ice."}
- {n: 5, speaker: Sacha, vi: "Em ơi! Cho anh một cà_phê sữa đá~ice và một cốc trà đá~ice.", en: "Excuse me! An iced coffee with milk and a glass of iced tea, please.", lit: "younger-sibling hey! give elder-brother one coffee milk ice and one glass tea ice."}
- {n: 6, speaker: Waiter, vi: "Hai cà_phê sữa đá~ice, phải~right không ạ?", en: "Two iced coffees with milk, is that right?", lit: "two coffee milk ice, right not (polite)?"}
- {n: 7, speaker: Sacha, vi: "Không phải~right. Một cà_phê sữa đá~ice và một trà đá~ice nhé.", en: "No. One iced coffee with milk and one iced tea, OK?", lit: "not right. one coffee milk ice and one tea ice, OK?"}
notes:
- {ref: 1, topic: grammar, text: "Quán này có trà không? \"does this café have tea?\": có … không? asks for yes or no; the answer repeats the verb: Có \"yes\", Không \"no\". này \"this\" follows its noun: quán này \"this café\"."}
- {ref: 1, topic: grammar, text: "có is \"to have, there is\". With another verb, có … không? asks \"do you …?\": Anh có uống trà không?"}
- {ref: 2, topic: grammar, text: "Anh không uống cà phê à? – Có. To a negative question, say what is true: Có \"I do\" (like French si), Không \"I don't\"."}
- {ref: 3, topic: grammar, text: "muốn \"to want\", before a noun or a verb: Anh muốn một cà phê; Anh muốn uống trà. cà phê sữa đá: each added word describes everything before it: cà phê sữa \"coffee with milk\", cà phê sữa đá \"iced coffee with milk\"."}
- {ref: 5, topic: pronouns, text: "Em ơi! calls a young waiter: em because he is younger, ơi \"hey\". It is friendly, not rude. To an older woman: Chị ơi!"}
- {ref: 5, topic: grammar, text: "Cho anh … \"give me …\": cho \"to give\" + the person + the thing, the everyday way to order. With strangers, cho tôi … is neutral. cốc \"glass\" is the Northern word; và \"and\" joins nouns."}
- {ref: 6, topic: particles, text: "…, phải không? \"…, right?\" checks a guess. The waiter adds ạ, polite to a customer."}
- {ref: 7, topic: grammar, text: "Không phải \"no, that's not right\". Before a noun, \"is not\" is không phải là: Chị Lan không phải là người Pháp. Plain không does not go before là."}
- {ref: 7, topic: particles, text: "Một trà đá nhé: nhé at the end makes a request or proposal friendly, like \"…, OK?\"."}
