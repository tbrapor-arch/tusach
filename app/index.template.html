<title>Tủ sách · Vietnamese</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+TC:wght@400;700&family=Nunito:wght@600;800;900&display=swap">
<style>
/*__FONTS__*/
/* Layout from Tsheh-tû: an app shell drawn as a school exercise book. Phones: one column with a bottom tab bar.
   Wide screens: a left rail with the same tabs. Vietnamese text is set in the embedded VietSans (Noto Sans subset with
   Vietnamese and mark positioning), so stacked marks (ế, ự, ỗ) draw the same everywhere. Chữ Hán appear only on word
   cards and in the bridge (--f-han). A second skin, "rose", is kept as an option. */
:root {
  --bg: #FCFCF8; --grid: #E3E9F6; --margin: #E8857F;
  --surface: #FFFFFF; --line: #1A2233; --soft-line: #CBD3E4;
  --text: #1A2233; --sub: #586276;
  --brand: #2347B5; --brand-ink: #FFFFFF; --brand-soft: #E5EBFA;
  --sun: #FFD84D; --sun-soft: #FFF5CC;
  --coral: #D23F38; --coral-soft: #FCE4E2;
  --shadow: 4px 4px 0 var(--brand); --shadow-soft: 3px 3px 0 var(--soft-line);
  --border: 2px solid var(--line); --border-soft: 2px solid var(--soft-line);
  --f-ui: "Atkinson Hyperlegible", "VietSans", system-ui, sans-serif;
  --f-vi: "VietSans", "Noto Sans", system-ui, sans-serif;
  --f-han: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --r: 8px; --r-big: 10px;
  color-scheme: light;
}
:root[data-night] {
  --bg: #15171D; --grid: #1F2330; --margin: #6E3434; --surface: #1C1F27; --line: #C9D1E6; --soft-line: #343A4C;
  --text: #E7EAF2; --sub: #9AA3B8; --brand: #8FA8FF; --brand-ink: #10152A; --brand-soft: #232B47;
  --sun: #FFD84D; --sun-soft: #3A3417; --coral: #FF8F86; --coral-soft: #3F2426; color-scheme: dark; }
:root[data-skin="rose"] {
  --bg: #FFF0F3; --grid: transparent; --margin: transparent; --surface: #FFFFFF; --line: #F3C7D3; --soft-line: #F7D9E1;
  --text: #2B1A2E; --sub: #85566A; --brand: #C93466; --brand-ink: #FFFFFF; --brand-soft: #FFE1EA;
  --sun: #FFC64D; --sun-soft: #FFF2D2; --coral: #C2410C; --coral-soft: #FFE7D6;
  --shadow: 0 6px 18px rgb(201 52 102 / .12); --shadow-soft: 0 3px 10px rgb(201 52 102 / .08);
  --border: 0 solid transparent; --border-soft: 0 solid transparent;
  --f-ui: "Nunito", "VietSans", system-ui, sans-serif; --r: 22px; --r-big: 28px; }
:root[data-skin="rose"][data-night] {
  --bg: #1E1219; --surface: #2A1A24; --line: #4A2E3C; --soft-line: #3A2430; --text: #FBEFF4; --sub: #C9A3B4;
  --brand: #FF7AA5; --brand-ink: #2B0F1C; --brand-soft: #4A2236; --sun-soft: #3B3017; --coral: #FF9E6B; --coral-soft: #3E2618; color-scheme: dark; }

html, body { height: 100%; }
body { margin: 0; background-color: var(--bg); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; color: var(--text); font-family: var(--f-vi); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
.han { font-family: var(--f-han); }
.vi { font-family: var(--f-vi); }

/* shell */
.shell { display: grid; grid-template-columns: 15rem minmax(0, 1fr); min-height: 100%; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; border-right: 1px solid var(--line); padding-block: 1.5rem; padding-inline: 1rem; display: flex; flex-direction: column; gap: 1.5rem; background: var(--bg); }
.logo { display: flex; align-items: center; gap: .6rem; padding-inline: .5rem; }
.logo .mark { width: 2.25rem; height: 2.25rem; border-radius: 10px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-family: var(--f-vi); font-weight: 800; font-size: 1rem; }
.logo b { font-family: var(--f-vi); font-weight: 800; font-size: 1.15rem; display: block; line-height: 1.1; }
.logo small { color: var(--sub); font-size: .8rem; }
.tabs { display: flex; flex-direction: column; gap: .25rem; }
.tab { display: flex; align-items: center; gap: .75rem; background: none; border: 0; border-radius: 12px; padding: .65rem .75rem; text-align: left; font-weight: 600; color: var(--sub); font-family: var(--f-ui); }
.tab svg { width: 1.35rem; height: 1.35rem; flex: none; }
.tab:hover { background: var(--surface); color: var(--text); }
.tab[aria-current="true"] { background: var(--brand-soft); color: var(--brand); }
main { min-width: 0; padding-block: calc(2rem + env(safe-area-inset-top, 0px)) 5rem; padding-inline: clamp(16px, 4vw, 3rem); }
.col { max-width: 44rem; margin-inline: auto; display: flex; flex-direction: column; gap: 1.5rem; border-left: 2px solid var(--margin); padding-left: clamp(12px, 3vw, 28px); }
@media (max-width: 820px) {
  .shell { grid-template-columns: 1fr; }
  .rail { position: fixed; z-index: 15; top: auto; bottom: 0; left: 0; right: 0; height: auto; border-right: 0; border-top: 1px solid var(--line); padding-block: .35rem calc(.35rem + env(safe-area-inset-bottom, 0px)); padding-inline: .5rem; }
  .logo { display: none; }
  .tabs { flex-direction: row; justify-content: space-around; }
  .tab { flex-direction: column; gap: .15rem; font-size: .7rem; padding: .35rem .4rem; }
  main { padding-block: calc(1.25rem + env(safe-area-inset-top, 0px)) 6.5rem; }
  .col { border-left: 0; padding-left: 0; }
}

/* type */
.eyebrow { font-family: var(--f-ui); font-size: .75rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--brand); }
h1 { margin: 0; font-family: var(--f-vi); font-weight: 800; font-size: clamp(2rem, 7vw, 2.6rem); line-height: 1.15; text-wrap: balance; }
h2 { margin: 0; font-size: 1.15rem; font-weight: 800; display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; }
.sub { color: var(--sub); }
.head { display: flex; flex-direction: column; gap: .2rem; }
.head .tl { font-size: 1.1rem; color: var(--brand); font-weight: 700; }

/* cards and buttons */
.card { background: var(--surface); border: var(--border-soft); border-radius: var(--r); box-shadow: var(--shadow-soft); padding: 1.1rem 1.2rem; display: flex; flex-direction: column; gap: .6rem; }
.card.raised { background: var(--bg); border: var(--border); box-shadow: var(--shadow); border-radius: var(--r-big); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; border: 0; border-radius: var(--r); padding: .65rem 1.25rem; font-family: var(--f-ui); font-weight: 700; font-size: .95rem; background: var(--brand); color: var(--brand-ink); }
.btn:hover { filter: brightness(1.05); }
.btn.quiet { background: var(--surface); color: var(--text); }
.btn.line { background: none; border: var(--border); color: var(--text); }
.btn.small { padding: .35rem .85rem; font-size: .85rem; }
.btn[disabled] { opacity: .5; cursor: default; }
:root[data-skin="rose"] .btn { border-radius: 999px; }
.row { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
.pill { display: inline-flex; align-items: center; font-family: var(--f-ui); font-size: .72rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: .2rem .6rem; border-radius: 4px; }
.p-same { background: var(--brand); color: var(--brand-ink); }
.p-ff { background: var(--coral); color: #fff; }
.p-native { background: var(--surface); color: var(--sub); border: 1px solid var(--line); }
.p-fx { background: var(--sun); color: #2B2100; }
.p-hvvn, .p-old, .p-loan { background: var(--surface); color: var(--brand); border: 1px solid var(--brand); }
.p-doubt { background: var(--surface); color: var(--coral); border: 1px dashed var(--coral); }
.bar { height: .5rem; border-radius: 999px; background: var(--soft-line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--sun); border-radius: 999px; }
.banner { font-family: var(--f-ui); font-weight: 700; font-size: .85rem; padding: .45rem .75rem; border-radius: var(--r); background: var(--sun-soft); border: 2px dashed var(--sun); }
.banner.fx { background: var(--sun); color: #2B2100; border-style: solid; }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--surface); border: var(--border-soft); border-radius: var(--r); padding: 3px; }
.seg button { border: 0; background: none; border-radius: calc(var(--r) - 2px); padding: .3rem .8rem; font-family: var(--f-ui); font-size: .85rem; font-weight: 600; color: var(--sub); }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--text); box-shadow: var(--shadow); }
.toggle { display: inline-flex; align-items: center; gap: .4rem; font-family: var(--f-ui); font-size: .85rem; font-weight: 600; color: var(--sub); }
.toggle input { accent-color: var(--brand); width: 1.05rem; height: 1.05rem; }
.legend { display: flex; gap: .8rem; font-family: var(--f-ui); font-size: .78rem; color: var(--sub); flex-wrap: wrap; }
.legend .k-same { border-bottom: 2.5px solid var(--brand); }
.legend .k-ff { border-bottom: 2.5px dotted var(--coral); }
.setgrid { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .8rem 1rem; align-items: center; }
.setgrid .lab { font-family: var(--f-ui); font-weight: 700; font-size: .9rem; }
.setgrid .seg { justify-self: start; }

/* lesson grid */
.lgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(4.6rem, 1fr)); gap: .5rem; }
.lt { position: relative; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .1rem; background: var(--surface); border: var(--border-soft); border-radius: var(--r); padding: .3rem; min-width: 0; }
.lt .ln { font-family: var(--f-ui); font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.lt .lh { font-size: .72rem; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.lt:not(.soon):hover { background: var(--brand-soft); }
.lt.next { border: var(--border); border-color: var(--brand); box-shadow: var(--shadow); }
.lt.done { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.lt.done .lh { color: var(--brand-ink); opacity: .85; }
.lt.soon { background: transparent; border-style: dashed; color: var(--sub); cursor: default; }
.lt.soon .ln { font-weight: 400; opacity: .6; }
.lt .w2 { position: absolute; top: .2rem; right: .3rem; font-family: var(--f-ui); font-size: .62rem; font-weight: 800; width: 1rem; height: 1rem; border-radius: 50%; background: var(--sun); color: #2B2100; display: grid; place-items: center; }
@media (max-width: 420px) { .lgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.nextcard, .card.wave { gap: .5rem; }
.card.wave { text-align: left; border: var(--border); border-color: var(--coral); }
.nc-main { display: flex; align-items: center; gap: .9rem; flex-wrap: wrap; }
.nc-n { font-family: var(--f-ui); font-weight: 700; font-size: 2rem; color: var(--brand); font-variant-numeric: tabular-nums; min-width: 2.2rem; }
.nc-t { flex: 1; min-width: 10rem; display: flex; flex-direction: column; }
.nc-t b { font-size: 1.4rem; line-height: 1.2; }
.journal summary, .allnotes summary { cursor: pointer; font-family: var(--f-ui); font-weight: 700; padding-block: .4rem; }
.journal ul { list-style: none; margin: .4rem 0 0; padding: 0; display: flex; flex-direction: column; }
.journal li { display: flex; gap: .8rem; align-items: baseline; padding: .35rem 0; border-bottom: 1px dashed var(--soft-line); font-size: .92rem; }
.journal time { color: var(--sub); min-width: 6.5rem; font-family: var(--f-ui); font-variant-numeric: tabular-nums; }
.linkish { border: 0; background: none; padding: 0; color: var(--text); text-align: left; }
.linkish:hover { color: var(--brand); text-decoration: underline; }

/* lists of items */
.list { display: flex; flex-direction: column; gap: .6rem; }
.item { display: grid; grid-template-columns: 3rem minmax(0, 1fr) auto; align-items: center; gap: .9rem; background: var(--surface); border: var(--border-soft); border-radius: var(--r); box-shadow: var(--shadow-soft); padding: .85rem 1rem; text-align: left; }
.item:hover { background: var(--brand-soft); }
.item .no { width: 3rem; height: 3rem; border-radius: var(--r); background: var(--bg); border: var(--border-soft); display: grid; place-items: center; font-weight: 800; font-size: 1.1rem; }
.item .tt { font-weight: 700; font-size: 1.1rem; }
.item .ts { color: var(--sub); font-size: .9rem; }
.item .chev { color: var(--sub); }
.vwrap { overflow-x: auto; border-radius: var(--r); background: var(--surface); border: var(--border-soft); }
.vtable { width: 100%; border-collapse: collapse; }
.vtable td, .vtable th { padding: .55rem .8rem; border-bottom: 1px solid var(--soft-line); vertical-align: middle; text-align: left; }
.vtable th { font-family: var(--f-ui); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--sub); }
.vtable tr:last-child td { border-bottom: 0; }
.vtable tr[data-word] { cursor: pointer; }
.vtable tr[data-word]:hover td { background: var(--brand-soft); }
.vtable .vw { font-size: 1.15rem; font-weight: 700; white-space: nowrap; }
.vtable .vh { font-family: var(--f-han); font-size: 1.15rem; white-space: nowrap; }
.vtable .vr { white-space: nowrap; }
.vtable .icon { border: 0; background: none; color: var(--sub); font-size: 1.1rem; }
.xback { border: 0; background: none; color: inherit; font: inherit; font-size: 1.1rem; padding: 0 .4rem 0 0; cursor: pointer; }
.lname { display: flex; align-items: center; gap: .6rem; }
.lname .icon.sq { flex: none; border: 1.5px solid var(--soft-line); border-radius: 8px; width: 2.2rem; height: 2.2rem; background: none; color: var(--brand); font-size: 1rem; }
.lren { font: inherit; font-size: 1.6rem; font-weight: 700; width: 100%; padding: .25rem .5rem; border: 1.5px solid var(--brand); border-radius: 8px; background: var(--surface); color: var(--text); }
.segs { display: flex; flex-direction: column; gap: .5rem; }
.seg-row { display: flex; gap: .6rem 1rem; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--surface); border: var(--border-soft); border-radius: var(--r); padding: .7rem .9rem; }
.seg-t { display: flex; flex-direction: column; min-width: 0; }
.seg-t b { font-size: 1.1rem; }
.seg-meta { font-size: .8rem; color: var(--sub); } .seg-meta b { color: var(--coral); font-size: inherit; }
.pracnav { align-self: flex-start; }

/* lesson reader */
.lbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; display: flex; align-items: center; gap: .2rem; background: var(--bg); border-bottom: 1px solid var(--line); margin-top: -.75rem; padding-block: .35rem; }
.lbar .where { flex: 1; min-width: 0; font-family: var(--f-ui); font-weight: 700; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-inline: .3rem; }
.lbar .icon { border: 0; background: none; width: 2.6rem; height: 2.6rem; border-radius: var(--r); font-size: 1.35rem; color: var(--brand); flex: none; }
.lbar .icon:hover:not([disabled]) { background: var(--brand-soft); }
.lbar .icon[disabled] { opacity: .3; cursor: default; }
.lnav { display: flex; gap: .4rem; flex-wrap: wrap; }
.lnav button { font-family: var(--f-ui); font-size: .82rem; font-weight: 700; color: var(--sub); background: var(--surface); border: var(--border-soft); border-radius: 999px; padding: .2rem .75rem; }
.lnav button:hover { color: var(--brand); border-color: var(--brand); }
#dlg, .allnotes, h2[id] { scroll-margin-top: 3.6rem; }
.toolbar { display: flex; gap: .5rem 1rem; flex-wrap: wrap; align-items: center; padding-block: .6rem; border-bottom: 1px solid var(--line); }
.setting { color: var(--sub); margin: 0; }
.lines { display: flex; flex-direction: column; gap: 1.25rem; }
.sent { display: flex; flex-direction: column; gap: .15rem; }
.sent .who { display: flex; align-items: center; gap: .5rem; font-family: var(--f-ui); font-size: .78rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--coral); }
.sent .who .n::after { content: " ·"; }
.txt { font-family: var(--f-vi); font-size: 1.55rem; line-height: 1.6; }
.tok { cursor: pointer; border-radius: 4px; }
.tok:hover, .tok.sel { background: var(--brand-soft); }
.tok.c-same { text-decoration: underline solid var(--brand) 2px; text-underline-offset: .25em; }
.tok.c-ff { text-decoration: underline dotted var(--coral) 2.5px; text-underline-offset: .25em; }
.tok.nocard { cursor: default; color: var(--coral); }
.punct { color: var(--sub); }
.under { display: flex; gap: .4rem .8rem; flex-wrap: wrap; align-items: center; }
.reveal { background: var(--surface); border: 2px dashed var(--soft-line); border-radius: 6px; color: var(--brand); font-family: var(--f-ui); font-weight: 700; font-size: .8rem; padding: .15rem .6rem; }
.en { color: var(--sub); font-size: .95rem; }
.en.act { font-size: 1.2rem; font-weight: 600; color: var(--text); }
.nlink { border: 0; background: var(--brand-soft); color: var(--brand); border-radius: 999px; min-width: 1.9rem; height: 1.9rem; font-size: .85rem; font-weight: 800; }
.lplay { border: var(--border-soft); background: var(--surface); color: var(--brand); border-radius: 999px; width: 1.9rem; height: 1.9rem; font-size: .75rem; padding: 0; }
.lplay.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.sent.noted .txt, .sent.saying .txt { background: var(--sun-soft); border-radius: 6px; }
.notes { list-style: none; margin: .6rem 0 0; padding: 0; display: flex; flex-direction: column; gap: .6rem; }
.note { display: grid; grid-template-columns: 1.8rem minmax(0, 1fr); gap: .7rem; padding: .7rem .8rem; border-radius: 12px; }
.note .nn { width: 1.8rem; height: 1.8rem; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-weight: 800; font-size: .8rem; }
.note p { margin: 0; max-width: 65ch; }
.note .tag, .note-tag { display: block; font-family: var(--f-ui); font-size: .72rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--sub); margin-bottom: .15rem; }
.note-tag.false-friend, .note .tag.false-friend { color: var(--coral); }
.note-tag.bridge, .note .tag.bridge { color: var(--brand); }
.note-body { margin: 0; font-size: 1.05rem; line-height: 1.6; max-width: 60ch; }
.wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(12.5rem, 1fr)); gap: .5rem; }
.wchip { display: flex; flex-direction: column; background: var(--surface); border: var(--border-soft); border-radius: var(--r); box-shadow: var(--shadow-soft); padding: .55rem .8rem; text-align: left; }
.wchip:hover { background: var(--brand-soft); }
.wchip b { font-size: 1.25rem; }
.wchip .g { font-size: .85rem; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wchip.c-same b { color: var(--brand); } .wchip.c-ff b { color: var(--coral); }
.wchip.indeck { box-shadow: inset 3px 0 0 var(--brand); }
.ex { display: flex; flex-direction: column; gap: .75rem; }
.exi .k { font-family: var(--f-ui); font-size: .72rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--sub); }
.exi .t { font-size: 1.3rem; }
.exi form { display: flex; gap: .5rem; flex-wrap: wrap; }
.exi input { flex: 1 1 10rem; min-width: 0; font: inherit; font-size: 1.1rem; padding: .55rem .9rem; border: 1.5px solid var(--line); border-radius: 999px; background: var(--bg); color: var(--text); }
.fb { font-weight: 600; }
.fb.ok { color: var(--brand); } .fb.no { color: var(--coral); } .fb.near { background: var(--sun-soft); border-radius: 8px; padding: .1rem .5rem; align-self: start; }
.finish { gap: .8rem; }
.wave-intro { margin: 0; padding: .7rem .9rem; border-radius: var(--r); background: var(--brand-soft); }
.copybox { width: 100%; min-height: 8rem; font: inherit; font-size: .85rem; }

/* review */
.fc { min-height: 18rem; align-items: center; justify-content: center; text-align: center; }
.fc .big { font-size: clamp(2.4rem, 10vw, 3.6rem); font-weight: 700; line-height: 1.15; }
.cloze { text-align: center; }
.cloze .blank { color: var(--brand); letter-spacing: .1em; }
.cloze .hit { background: var(--sun-soft); border-radius: 4px; }
.answer { display: flex; flex-direction: column; align-items: center; gap: .3rem; }
.answer .ah { font-size: 2.2rem; font-weight: 700; line-height: 1.1; }
.stat { display: flex; align-items: baseline; gap: .4rem; }
.stat b { font-size: 2.2rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.empty { color: var(--sub); max-width: 52ch; }
kbd { font-family: var(--f-ui); font-size: .7rem; font-weight: 700; border: 1px solid currentColor; border-radius: 4px; padding: 0 .3rem; opacity: .6; margin-left: .2rem; }
@media (hover: none) { kbd { display: none; } }

/* word sheet */

<script>
// The course data sits in the JSON block above (JSON.parse reads it faster than the same data as a script).

};
// display preferences only: look, night mode, English shown, active mode, review audio. No setting depends on the

  const tc = document.querySelector('meta[name=theme-color]'); if (tc) tc.content = getComputedStyle(r).getPropertyValue('--bg').trim() || '#FCFCF8';

// ---------- installed app (only on the hosted site, which adds a manifest)
const HOSTED = !!document.querySelector('link[rel=manifest]');
const STANDALONE = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
let installEvt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (currentTab() === 'settings') showSettings(); });

let deck = store.get('deck', {});
// ---------- word lists: a word added from a card goes to the list of the page being read (one for the lessons, one per

let lists = store.get('lists', {});

const LIST_TITLES = {};   // titles only the private module knows (its books)
function listTitle(k) { return (lists[k] && lists[k].nm) || listBase(k); }
function listBase(k) { const [kind, id] = k.split(':'); if (k === 'lessons') return 'Lessons'; if (k === 'private') return 'Private'; if (kind === 'book') return LIST_TITLES[k] || (lists[k] && lists[k].t) || id; return k; }
const LIST_KIND = { lessons: ['Bài', 'Lessons'], book: ['Sách', 'Book'], private: ['Riêng', 'Private'] };
const listKind = k => LIST_KIND[k.split(':')[0]] || ['Từ', ''];
function listHere() {

  store.set('lists', lists); if (on && n) studied(); return n;
}

  Object.entries(o || {}).forEach(([k, L]) => {
    const M = lists[k] = lists[k] || { w: {} };
    if (L.t && !M.t) M.t = L.t;
    if ((L.nmAt || 0) > (M.nmAt || 0)) { M.nmAt = L.nmAt; if (L.nm) M.nm = L.nm; else delete M.nm; }

function progressData() { return { app: APP, v: 1, at: new Date().toISOString(), doneAt, waveAt, marks, deck, lists, days: [...studyDays], last: store.get('last', null) }; }

  Object.entries(d.deck || {}).forEach(([k, v]) => { const m = deck[k]; if (!m || (v.at || 0) > (m.at || 0)) deck[k] = v; });

let studyDays = new Set(store.get('days', []));
const DAY = 864e5, BOXES = [0, 1, 3, 7, 16, 35];
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

const fmtDate = s => { if (!s) return ''; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); };

// the card label (handover section 5): same word in Chinese / false friend / native Vietnamese word
const LABEL = { 'same': ['p-same', 'Same word in Chinese', 'c-same'], 'false-friend': ['p-ff', 'False friend', 'c-ff'], 'native': ['p-native', 'Native Vietnamese word', ''],
  'hv-vn': ['p-hvvn', 'Hán-Việt, formed in Vietnamese', ''], 'older-loan': ['p-old', 'Older Chinese loan', ''], 'loan': ['p-loan', 'Loanword', ''],
  'compound': ['p-native', 'Compound', ''], 'doubtful': ['p-doubt', 'Etymology doubtful', ''], 'opaque': ['p-doubt', 'Opaque etymology', ''] };
const lab = id => LABEL[(DATA.dict[id] || {}).label] || ['', '', ''];
const ICONS = {
  lessons: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21a2 2 0 0 1 2-2h13"/></svg>',

  books: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 5c3-1.5 6-1.5 9 .5 3-2 6-2 9-.5v14c-3-1.5-6-1.5-9 .5-3-2-6-2-9-.5z"/><path d="M12 5.5v14"/></svg>',

// ---------- routing
let WAVE = false;
let homeY = 0;
function route() {
  const h = location.hash.slice(1) || 'lessons';
  if (!route.keepSheet) closeSheet();
  let m;

  if ((m = h.match(/^(lesson|wave)-(\d+)$/))) { const L = DATA.lessons.find(l => l.id === +m[2]); if (L) { WAVE = m[1] === 'wave'; store.set('last', L.id); return showLesson(L); } }

// ---------- tokenised sentence: words as written in the lesson (boundaries from the source, never guessed)
const TOKS = {};
function tokHTML(tok, key) {

(() => {

// ---------- sync between devices: progress in a secret GitHub gist (token kept in this browser)
const Sync = {

  snap() { const d = progressData(); delete d.at; return JSON.stringify(d); },

    return this.snap() !== before;

  async push() { await this.api('/gists/' + await this.findOrCreate(), { method: 'PATCH', body: JSON.stringify({ files: { [this.FILE]: { content: JSON.stringify(progressData()) } } }) }); },
  async run(quiet) {

  },
  urls: {},
  async media(path) { if (!this.urls[path]) this.urls[path] = this.file(path).then(r => r.blob()).then(b => URL.createObjectURL(b)); return this.urls[path]; },
  async load() {
    if (this.loaded) return this.loaded;
    return this.loaded = (async () => {
      let c = null; try { c = await caches.open(this.CACHE); } catch {}
      try { const r = await this.raw('module/index.json'); this.index = await r.clone().json(); if (c) await c.put('https://private.invalid/index.json', r); }
      catch (e) { const hit = c && await c.match('https://private.invalid/index.json'); if (!hit) throw e; this.index = await hit.json(); }
      const css = document.createElement('style'); css.textContent = await (await this.file('app.css')).text(); document.head.append(css);
      const js = await (await this.file('app.js')).text();
      await new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = URL.createObjectURL(new Blob([js], { type: 'text/javascript' })); sc.onload = res; sc.onerror = rej; document.head.append(sc); });
      if (window.PrivateModule) await window.PrivateModule.init(this);
    })().catch(e => { this.loaded = null; throw e; });
  },
  fill(root) { if (this.on) this.load().then(() => window.PrivateModule && window.PrivateModule.fill && window.PrivateModule.fill(root)).catch(() => {}); },
  async show(h) {
    renderTabs(currentTab());
    const here = location.hash, ti = /^private-book/.test(h) ? 'Books' : 'Private';
    if (!this.on) { $('#main').innerHTML = `<div class="col"><div class="head"><span class="eyebrow">${ti}</span><h1>${ti}</h1></div><p class="sub">Not available on this device.</p></div>`; return; }
    if (!window.PrivateModule) $('#main').innerHTML = `<div class="col"><div class="head"><span class="eyebrow">${ti}</span><h1>${ti}</h1></div><p class="sub">Loading…</p></div>`;
    try { await this.load(); if (location.hash === here) window.PrivateModule.route(h); }
    catch (e) { $('#main').innerHTML = `<div class="col"><div class="head"><span class="eyebrow">${ti}</span><h1>${ti}</h1></div><div class="card raised"><b>Could not load the private module</b><span class="sub">${esc(e.message || e)}. It needs the internet the first time; after that it works offline.</span></div></div>`; }
  },
};
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }
applySkin();
route();
if (Sync.token) { const was = Priv.on; Priv.check().then(on => { if (on !== was) { if (/^private/.test(location.hash.slice(1))) route(); else renderTabs(currentTab()); } if (on) Priv.load().then(() => renderTabs(currentTab())).catch(() => {}); }); }
if (Sync.on) Sync.run(true).then(ch => { if (ch) refreshAfterSync(); });
</script>
